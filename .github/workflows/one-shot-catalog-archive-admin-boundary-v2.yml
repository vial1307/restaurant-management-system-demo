name: One-shot catalog archive admin boundary v2

on:
  push:
    paths:
      - ".github/workflows/one-shot-catalog-archive-admin-boundary-v2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enforce admin-only archive helpers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/inventory-cloud.js")
          text = path.read_text()
          old = 'if (!canDirectInventoryAdjust()) return { ok: false, fallback: false, error: new Error("CATALOG_EDIT_NOT_ALLOWED") };'
          new = 'if (role() !== "admin") return { ok: false, fallback: false, error: new Error("ADMIN_REQUIRED") };'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f"expected exactly 2 archive helper guards, found {count}")
          path.write_text(text.replace(old, new))
          PY
      - name: Run targeted permission and inventory regressions
        run: |
          node tests/catalog-archive-admin-boundary-regression.mjs
          node tests/inventory-hydration-authority-regression.mjs
          node tests/inventory-empty-snapshot-regression.mjs
          node tests/branch-empty-catalog-fallback-contract-regression.mjs
          node tests/central-empty-cache-reseed-contract-regression.mjs
          node tests/inventory-auth-grace-retry-regression.mjs
          node tests/fuxing-large-freezer-stocktake-regression.mjs
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-catalog-archive-admin-boundary-v2.yml
          git add src/inventory-cloud.js tests docs
          git commit -m "Align catalog archive helpers with admin boundary"
          git push origin HEAD:${{ github.ref_name }}
