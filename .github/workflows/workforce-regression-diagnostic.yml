name: Workforce Regression Diagnostic

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workforce-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kitchen_test
          POSTGRES_PASSWORD: kitchen_test
          POSTGRES_DB: kitchen_test
        options: >-
          --health-cmd "pg_isready -U kitchen_test -d kitchen_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: kitchen_test
      POSTGRES_USER: kitchen_test
      POSTGRES_PASSWORD: kitchen_test
      COOKIE_SECURE: "false"
      SESSION_DAYS: "1"
      PORT: "8080"
      TEST_API_BASE: "http://127.0.0.1:8080"
      TEST_WEB_BASE: "http://localhost:3000"
      PLAYWRIGHT_BROWSERS_PATH: "/ms-playwright"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install regression packages
        run: |
          npm ci --prefix vps/backend
          npm ci --prefix tests

      - name: Prepare isolated database
        run: node vps/backend/scripts/regression-setup.mjs

      - name: Start API
        run: |
          node vps/backend/src/server.mjs >/tmp/kitchen-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/kitchen-api.log
          exit 1

      - name: Start frontend
        run: |
          node tests/web-server.mjs >/tmp/kitchen-web.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/kitchen-web.log
          exit 1

      - name: Payroll approval browser regression
        run: bash tests/run-workforce-approval-only.sh

      - name: Workforce request contract regression
        run: node tests/workforce-request-contract-regression.mjs

      - name: Workforce request browser regression
        run: node tests/workforce-request-browser-regression.mjs

      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "=== API LOG ==="
          cat /tmp/kitchen-api.log 2>/dev/null || true
          echo "=== WEB LOG ==="
          cat /tmp/kitchen-web.log 2>/dev/null || true
