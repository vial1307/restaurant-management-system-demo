name: Patch central stocktake UI boundary

on:
  push:
    branches:
      - fix-central-stocktake-ui-boundary-20260907
    paths:
      - ".github/workflows/patch-central-stocktake-ui-boundary.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply central stocktake UI patch
        run: python3 scripts/patch-central-stocktake-ui-boundary.py
      - name: Validate patched JavaScript
        run: |
          node --check src/auth-layer.js
          node --check tests/browser-regression.mjs
      - name: Commit patched source and regression
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/auth-layer.js tests/browser-regression.mjs
          git commit -m "Enforce central stocktake UI boundary"
          git push origin HEAD:fix-central-stocktake-ui-boundary-20260907
