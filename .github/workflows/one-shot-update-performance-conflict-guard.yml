name: One-shot semantic conflict guard update

on:
  push:
    branches:
      - fix-business-conflict-recovery-20260908
    paths:
      - ".github/workflows/one-shot-update-performance-conflict-guard.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix-business-conflict-recovery-20260908

      - name: Update performance guard semantically
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tests/performance-regression-core.mjs")
          text = path.read_text(encoding="utf-8")
          old = 'assert.match(businessSync, /catch \\(error\\) \\{[\\s\\S]{0,260}status:"error"[\\s\\S]{0,140}return false;/, "failed business-state saves must report failure to the focus\\/online sync chain");'
          new = '''const businessSave = businessSync.match(/async function save\\(\\) \\{[\\s\\S]*?\\n  \\}\\n\\n  function scheduleSave\\(\\)/)?.[0] || "";
          assert.match(businessSave, /catch \\(error\\) \\{/, "business-state save must retain an explicit failure boundary");
          assert.match(businessSave, /emitPersistenceStatus\\("error", \\{ userId, site, modules: dirtyNames, error:error\\.message \\}\\);[\\s\\S]*?return false;/, "failed business-state saves must report failure to the focus\\/online sync chain");'''.replace("          ", "")
          if text.count(old) != 1:
              raise SystemExit(f"performance guard anchor count={text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Validate updated gates
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/performance-regression-core.mjs
          node tests/performance-regression.mjs
          node tests/business-state-module-revision-regression.mjs
          node tests/business-state-recovery-metadata-regression.mjs 2>/dev/null || node tests/business-recovery-metadata-regression.mjs

      - name: Commit guard update
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-update-performance-conflict-guard.yml
          git add tests/performance-regression-core.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Guard business save failures by semantics"
          git push origin HEAD:fix-business-conflict-recovery-20260908
