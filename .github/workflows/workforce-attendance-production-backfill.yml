name: Workforce Attendance Production Backfill

on:
  workflow_run:
    workflows:
      - "Deploy Kitchen OS to VPS"
    types:
      - completed
  workflow_dispatch:
    inputs:
      mode:
        description: "verify reads production only; apply creates a DB backup then writes relational attendance rows"
        required: true
        default: verify
        type: choice
        options:
          - verify
          - apply
      site:
        description: "Optional site code; all runs every active site"
        required: true
        default: all
        type: choice
        options:
          - all
          - fuxing
          - yongji
          - central

permissions:
  contents: read

concurrency:
  group: kitchen-os-production-maintenance
  cancel-in-progress: false

jobs:
  production-backfill:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'verify' }}
      SITE: ${{ github.event_name == 'workflow_dispatch' && inputs.site || 'all' }}
      DEPLOYED_HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
    steps:
      - name: Checkout maintenance source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Require VPS SSH secret
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: test -n "$VPS_SSH_KEY"

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/kitchen_actions"
          chmod 600 "$HOME/.ssh/kitchen_actions"
          ssh-keyscan -H 82.47.180.185 >> "$HOME/.ssh/known_hosts"

      - name: Verify deployed release and maintenance source
        run: |
          set -euo pipefail
          ACTUAL_RELEASE="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 http://82.47.180.185/RELEASE | tr -d '[:space:]')"
          REMOTE_RELEASE="$(ssh -i "$HOME/.ssh/kitchen_actions" -o BatchMode=yes -o ConnectTimeout=15 deploy@82.47.180.185 \
            "git -C /opt/kitchen-os/repo rev-parse --short HEAD")"
          LOCAL_SCRIPT_SHA="$(sha256sum vps/backend/scripts/workforce-attendance-backfill.mjs | cut -d' ' -f1)"
          REMOTE_SCRIPT_SHA="$(ssh -i "$HOME/.ssh/kitchen_actions" -o BatchMode=yes -o ConnectTimeout=15 deploy@82.47.180.185 \
            "test -f /opt/kitchen-os/repo/vps/backend/scripts/workforce-attendance-backfill.mjs && sha256sum /opt/kitchen-os/repo/vps/backend/scripts/workforce-attendance-backfill.mjs | cut -d' ' -f1")"

          echo "Production release: ${ACTUAL_RELEASE}"
          echo "Production repo: ${REMOTE_RELEASE}"
          test "$ACTUAL_RELEASE" = "$REMOTE_RELEASE"
          test "$LOCAL_SCRIPT_SHA" = "$REMOTE_SCRIPT_SHA"

          if [[ -n "$DEPLOYED_HEAD_SHA" ]]; then
            EXPECTED_RELEASE="${DEPLOYED_HEAD_SHA:0:7}"
            echo "Expected deployed release: ${EXPECTED_RELEASE}"
            test "$ACTUAL_RELEASE" = "$EXPECTED_RELEASE"
          fi

      - name: Verify or apply workforce attendance backfill
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" && "$MODE" != "verify" ]]; then
            echo "Automatic maintenance is restricted to verify-only."
            exit 64
          fi

          SITE_ARG=""
          if [[ "$SITE" != "all" ]]; then
            SITE_ARG="--site=$SITE"
          fi

          SSH=(ssh -i "$HOME/.ssh/kitchen_actions" -o BatchMode=yes -o ConnectTimeout=15 deploy@82.47.180.185)
          APP_DIR=/opt/kitchen-os
          "${SSH[@]}" "cd '$APP_DIR' && test -f repo/vps/backend/scripts/workforce-attendance-backfill.mjs && docker compose --env-file .env ps app db </dev/null"

          if [[ "$MODE" == "apply" ]]; then
            echo "Creating mandatory pre-backfill database backup..."
            "${SSH[@]}" "cd '$APP_DIR' && bash repo/vps/scripts/backup.sh </dev/null"
            echo "Applying transactional attendance backfill..."
            "${SSH[@]}" "cd '$APP_DIR' && docker compose --env-file .env exec -T app node scripts/workforce-attendance-backfill.mjs --apply $SITE_ARG </dev/null"
          else
            echo "Running read-only production attendance backfill verification..."
            "${SSH[@]}" "cd '$APP_DIR' && docker compose --env-file .env exec -T app node scripts/workforce-attendance-backfill.mjs $SITE_ARG </dev/null"
          fi

      - name: Verify production remains healthy
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 http://82.47.180.185/api/health
          echo
          curl --fail --silent --show-error --retry 5 --retry-delay 2 http://82.47.180.185/RELEASE
