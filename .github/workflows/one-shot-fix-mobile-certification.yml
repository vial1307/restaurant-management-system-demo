name: One-shot fix mobile certification close

on:
  push:
    branches:
      - test-mobile-role-site-certification-v2-20260907
    paths:
      - ".github/workflows/one-shot-fix-mobile-certification.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: test-mobile-role-site-certification-v2-20260907

      - name: Replace ambiguous backdrop click with supported Escape close
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/mobile-role-site-certification.mjs")
          text = path.read_text()
          old = '    await page.locator(\'[data-action="close-mobile-menu"]\').first().click();\n'
          new = '    await page.keyboard.press("Escape");\n'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one mobile-menu close call, found {count}")
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/one-shot-fix-mobile-certification.yml

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Close mobile certification menu through supported Escape interaction"
          git push origin HEAD:test-mobile-role-site-certification-v2-20260907
