name: Private Finance DB Regression
on:
  pull_request:
    branches: [main]
    paths:
      - "vps/finance/**"
      - "vps/docker-compose.finance.yml"
      - "tests/personal-finance-schema-contract-regression.mjs"
      - ".github/workflows/personal-finance-db-regression.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finance-database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: finance_test
          POSTGRES_PASSWORD: finance_test
          POSTGRES_DB: kitchen_test
        options: >-
          --health-cmd "pg_isready -U finance_test -d kitchen_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: finance_test
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: finance_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check static finance DB contract
        run: node tests/personal-finance-schema-contract-regression.mjs
      - name: Create separate test database
        run: createdb personal_finance_test
      - name: Apply schema twice to verify migration idempotency
        run: |
          psql -v ON_ERROR_STOP=1 -d personal_finance_test -f vps/finance/migrations/001_personal_finance.sql
          psql -v ON_ERROR_STOP=1 -d personal_finance_test -f vps/finance/migrations/001_personal_finance.sql
      - name: Validate core constraints and kitchen DB isolation
        run: |
          psql -v ON_ERROR_STOP=1 -d personal_finance_test <<'SQL'
          DO $$
          BEGIN
            IF (SELECT COUNT(*) FROM finance.currencies) <> 6 THEN
              RAISE EXCEPTION 'FINANCE_CURRENCIES_MISSING';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM finance.schema_migrations WHERE version='001_personal_finance') THEN
              RAISE EXCEPTION 'FINANCE_MIGRATION_NOT_APPLIED';
            END IF;
          END $$;
          SQL
          COUNT=$(psql -At -d kitchen_test -c "SELECT COUNT(*) FROM information_schema.schemata WHERE schema_name='finance'")
          test "$COUNT" = "0"
      - name: Assert negative amounts and currencies are rejected
        run: |
          set -e
          psql -d personal_finance_test -v ON_ERROR_STOP=1 -c "INSERT INTO finance.currencies VALUES ('INVALID','No','N',2)" >/dev/null 2>&1 && exit 1 || true
          echo 'PASS invalid ISO currency code cannot be inserted'
