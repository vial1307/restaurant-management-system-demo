name: Private Finance DB Regression
on:
  pull_request:
    branches: [main]
    paths:
      - "vps/finance/**"
      - "vps/docker-compose.finance.yml"
      - "tests/personal-finance-schema-contract-regression.mjs"
      - "tests/finance-advisor-engine-regression.mjs"
      - "tests/finance-scenario-engine-regression.mjs"
      - "tests/finance-debt-payoff-regression.mjs"
      - "tests/finance-mentor-engine-regression.mjs"
      - "tests/finance-mentor-brief-regression.mjs"
      - "tests/finance-fx-valuation-regression.mjs"
      - "vps/backend/src/finance-*.mjs"
      - "vps/backend/src/server.mjs"
      - "vps/backend/scripts/finance-api-regression.mjs"
      - "finance.html"
      - "src/personal-finance.*"
      - ".github/workflows/personal-finance-db-regression.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finance-database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: finance_test
          POSTGRES_PASSWORD: finance_test
          POSTGRES_DB: kitchen_test
        options: >-
          --health-cmd "pg_isready -U finance_test -d kitchen_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: finance_test
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: finance_test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      POSTGRES_DB: kitchen_test
      POSTGRES_USER: finance_test
      POSTGRES_PASSWORD: finance_test
      FINANCE_DB_HOST: 127.0.0.1
      FINANCE_DB_PORT: 5432
      FINANCE_DB_NAME: personal_finance_test
      FINANCE_DB_USER: finance_test
      FINANCE_DB_PASSWORD: finance_test
      TEST_API_BASE: http://127.0.0.1:8080
      COOKIE_SECURE: "false"
      FINANCE_FX_AUTO_REFRESH: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check static finance DB contract
        run: node tests/personal-finance-schema-contract-regression.mjs
      - name: Deterministic cashflow advisor engine regression
        run: node tests/finance-advisor-engine-regression.mjs
      - name: Exchange rate valuation and stale-rate safety regression
        run: node tests/finance-fx-valuation-regression.mjs
      - name: Debt priority and monthly payoff allocation regression
        run: node tests/finance-debt-payoff-regression.mjs
      - name: Scenario finance simulation regression
        run: node tests/finance-scenario-engine-regression.mjs
      - name: Mentor creditor semantics regression
        run: node tests/finance-mentor-engine-regression.mjs
      - name: Mentor rolling date liquidity regression
        run: node tests/finance-mentor-brief-regression.mjs
      - name: Create separate test database
        run: createdb personal_finance_test
      - name: Apply schema twice to verify migration idempotency
        run: |
          psql -v ON_ERROR_STOP=1 -d personal_finance_test -f vps/finance/migrations/001_personal_finance.sql
          psql -v ON_ERROR_STOP=1 -d personal_finance_test -f vps/finance/migrations/001_personal_finance.sql
          psql -v ON_ERROR_STOP=1 -d personal_finance_test -f vps/finance/migrations/002_finance_cashflow_debt_fund.sql
          psql -v ON_ERROR_STOP=1 -d personal_finance_test -f vps/finance/migrations/002_finance_cashflow_debt_fund.sql
          psql -v ON_ERROR_STOP=1 -d personal_finance_test -f vps/finance/migrations/003_finance_goal_funds.sql
          psql -v ON_ERROR_STOP=1 -d personal_finance_test -f vps/finance/migrations/003_finance_goal_funds.sql
          psql -v ON_ERROR_STOP=1 -d personal_finance_test -f vps/finance/migrations/004_finance_scenario_workbooks.sql
          psql -v ON_ERROR_STOP=1 -d personal_finance_test -f vps/finance/migrations/004_finance_scenario_workbooks.sql
          psql -v ON_ERROR_STOP=1 -d personal_finance_test -f vps/finance/migrations/005_finance_estimated_fx_cashflow.sql
          psql -v ON_ERROR_STOP=1 -d personal_finance_test -f vps/finance/migrations/005_finance_estimated_fx_cashflow.sql
          psql -v ON_ERROR_STOP=1 -d personal_finance_test -f vps/finance/migrations/007_finance_mentor_obligations.sql
          psql -v ON_ERROR_STOP=1 -d personal_finance_test -f vps/finance/migrations/007_finance_mentor_obligations.sql
          psql -v ON_ERROR_STOP=1 -d personal_finance_test -f vps/finance/migrations/008_finance_loan_receipts.sql
          psql -v ON_ERROR_STOP=1 -d personal_finance_test -f vps/finance/migrations/008_finance_loan_receipts.sql
          psql -v ON_ERROR_STOP=1 -d personal_finance_test -f vps/finance/migrations/009_finance_planned_borrowing.sql
          psql -v ON_ERROR_STOP=1 -d personal_finance_test -f vps/finance/migrations/009_finance_planned_borrowing.sql
      - name: Validate core constraints and kitchen DB isolation
        run: |
          psql -v ON_ERROR_STOP=1 -d personal_finance_test <<'SQL'
          DO $$
          BEGIN
            IF (SELECT COUNT(*) FROM finance.currencies) <> 6 THEN
              RAISE EXCEPTION 'FINANCE_CURRENCIES_MISSING';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM finance.schema_migrations WHERE version='004_finance_scenario_workbooks') THEN
              RAISE EXCEPTION 'FINANCE_MIGRATION_NOT_APPLIED';
            END IF;
          END $$;
          SQL
          COUNT=$(psql -At -d kitchen_test -c "SELECT COUNT(*) FROM information_schema.schemata WHERE schema_name='finance'")
          test "$COUNT" = "0"
      - name: Install backend dependencies
        run: npm ci --prefix vps/backend
      - name: Create isolated Kitchen OS test session fixtures
        run: node vps/backend/scripts/regression-setup.mjs
      - name: Set test finance owner UUID from isolated Kitchen OS fixture
        run: |
          OWNER=$(psql -At -d kitchen_test -c "SELECT id FROM public.app_users WHERE username='managerfx'")
          test -n "$OWNER"
          echo "FINANCE_OWNER_USER_ID=$OWNER" >> "$GITHUB_ENV"
      - name: Start private API with both test DBs
        run: |
          node --check vps/backend/src/finance-fx-valuation.mjs
          node --check vps/backend/src/finance-db.mjs
          node --check vps/backend/src/finance-routes.mjs
          node --check vps/backend/src/finance-planning-routes.mjs
          node --check vps/backend/src/finance-debt-payoff-engine.mjs
          node --check vps/backend/src/finance-advisor-engine.mjs
          node --check vps/backend/src/finance-advisor-routes.mjs
          node --check vps/backend/src/finance-mentor-engine.mjs
          node --check vps/backend/src/finance-mentor-brief.mjs
          node --check vps/backend/src/finance-mentor-routes.mjs
          node --check src/finance-mentor-ui.js
          node --check src/finance-plan-sheet.js
          node --check vps/backend/src/finance-scenario-engine.mjs
          node --check vps/backend/src/finance-scenario-routes.mjs
          node --check vps/backend/scripts/finance-api-regression.mjs
          node --check src/personal-finance.js
          node vps/backend/src/server.mjs > /tmp/finance-api-test.log 2>&1 &
          for attempt in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/finance-api-test.log
          exit 1
      - name: Owner authorization, budget, multi-currency and ledger API regression
        run: node vps/backend/scripts/finance-api-regression.mjs
      - name: Debug isolated API when failed
        if: failure()
        run: tail -n 120 /tmp/finance-api-test.log || true
      - name: Assert negative amounts and currencies are rejected
        run: |
          set -e
          if psql -d personal_finance_test -v ON_ERROR_STOP=1 -c "INSERT INTO finance.currencies VALUES ('INVALID','No','N',2)" >/dev/null 2>&1; then
            echo "FAIL invalid ISO currency accepted" >&2
            exit 1
          fi
          echo 'PASS invalid ISO currency code cannot be inserted'
