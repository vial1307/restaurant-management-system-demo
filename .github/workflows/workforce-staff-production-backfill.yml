name: Workforce Staff Production Backfill

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/workforce-staff-production-backfill.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "verify reads production only; apply creates a DB backup then writes relational staff identity rows"
        required: true
        default: verify
        type: choice
        options:
          - verify
          - apply
      site:
        description: "Optional site code; all runs every active site"
        required: true
        default: all
        type: choice
        options:
          - all
          - fuxing
          - yongji
          - central

permissions:
  contents: read

concurrency:
  group: kitchen-os-production-maintenance
  cancel-in-progress: false

jobs:
  production-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'verify' }}
      SITE: ${{ github.event_name == 'workflow_dispatch' && inputs.site || 'all' }}
    steps:
      - name: Require VPS SSH secret
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: test -n "$VPS_SSH_KEY"

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/kitchen_actions"
          chmod 600 "$HOME/.ssh/kitchen_actions"
          ssh-keyscan -H 82.47.180.185 >> "$HOME/.ssh/known_hosts"

      - name: Verify production release and maintenance script
        run: |
          set -euo pipefail
          ACTUAL_RELEASE="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 http://82.47.180.185/RELEASE | tr -d '[:space:]')"
          REMOTE_RELEASE="$(ssh -i "$HOME/.ssh/kitchen_actions" -o BatchMode=yes -o ConnectTimeout=15 deploy@82.47.180.185 \
            "git -C /opt/kitchen-os/repo rev-parse --short HEAD && test -f /opt/kitchen-os/repo/vps/backend/scripts/workforce-staff-backfill.mjs")"
          echo "Production release: ${ACTUAL_RELEASE}"
          echo "Production repo: ${REMOTE_RELEASE}"
          test "$ACTUAL_RELEASE" = "$REMOTE_RELEASE"

      - name: Verify or apply workforce staff backfill
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$MODE" != "verify" ]]; then
            echo "Push-triggered maintenance is restricted to verify-only."
            exit 64
          fi

          SITE_ARG=""
          if [[ "$SITE" != "all" ]]; then
            SITE_ARG="--site=$SITE"
          fi

          ssh -i "$HOME/.ssh/kitchen_actions" -o BatchMode=yes -o ConnectTimeout=15 deploy@82.47.180.185 \
            "MODE='$MODE' SITE_ARG='$SITE_ARG' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_DIR=/opt/kitchen-os
          cd "$APP_DIR"

          test -f repo/vps/backend/scripts/workforce-staff-backfill.mjs
          docker compose --env-file .env ps app db

          if [[ "$MODE" == "apply" ]]; then
            echo "Creating mandatory pre-backfill database backup..."
            bash repo/vps/scripts/backup.sh
            echo "Applying transactional staff identity backfill..."
            docker compose --env-file .env exec -T app \
              node scripts/workforce-staff-backfill.mjs --apply ${SITE_ARG:+"$SITE_ARG"}
          else
            echo "Running read-only production backfill verification..."
            docker compose --env-file .env exec -T app \
              node scripts/workforce-staff-backfill.mjs ${SITE_ARG:+"$SITE_ARG"}
          fi
          REMOTE

      - name: Verify production remains healthy
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 http://82.47.180.185/api/health
          echo
          curl --fail --silent --show-error --retry 5 --retry-delay 2 http://82.47.180.185/RELEASE
