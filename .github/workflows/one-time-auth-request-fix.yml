name: One-time auth request dedupe

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-auth-request-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Dedupe concurrent auth requests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          api = Path("src/vps-api.js")
          text = api.read_text(encoding="utf-8")

          state_anchor = "let lastSuccessfulLoginAt = 0;\n"
          if state_anchor not in text:
              raise SystemExit("vps-api auth state anchor missing")
          if "let authMeInFlight = null;" not in text:
              text = text.replace(state_anchor, state_anchor + "let authMeInFlight = null;\nlet adminUsersInFlight = null;\n", 1)

          cache_old = "function clearRuntimeCaches() {\n  invalidateVpsInventoryCache(\"\");\n  invalidateVpsReceiveDefaultsCache();\n}"
          cache_new = "function clearRuntimeCaches() {\n  invalidateVpsInventoryCache(\"\");\n  invalidateVpsReceiveDefaultsCache();\n  authMeInFlight = null;\n  adminUsersInFlight = null;\n}"
          if cache_old not in text and cache_new not in text:
              raise SystemExit("runtime cache anchor missing")
          text = text.replace(cache_old, cache_new, 1)

          me_old = "export function vpsMe() {\n  return apiRequest(\"/api/auth/me\");\n}"
          me_new = "export function vpsMe() {\n  if (authMeInFlight) return authMeInFlight;\n  let pending;\n  pending = apiRequest(\"/api/auth/me\").finally(() => {\n    if (authMeInFlight === pending) authMeInFlight = null;\n  });\n  authMeInFlight = pending;\n  return pending;\n}"
          if me_old not in text and me_new not in text:
              raise SystemExit("vpsMe anchor missing")
          text = text.replace(me_old, me_new, 1)

          users_old = "export function vpsListUsers() {\n  return apiRequest(\"/api/admin/users\");\n}"
          users_new = "export function vpsListUsers() {\n  if (adminUsersInFlight) return adminUsersInFlight;\n  let pending;\n  pending = apiRequest(\"/api/admin/users\").finally(() => {\n    if (adminUsersInFlight === pending) adminUsersInFlight = null;\n  });\n  adminUsersInFlight = pending;\n  return pending;\n}"
          if users_old not in text and users_new not in text:
              raise SystemExit("vpsListUsers anchor missing")
          text = text.replace(users_old, users_new, 1)

          if text.count("if (authMeInFlight) return authMeInFlight;") != 1:
              raise SystemExit("auth-me in-flight guard not installed exactly once")
          if text.count("if (adminUsersInFlight) return adminUsersInFlight;") != 1:
              raise SystemExit("admin-users in-flight guard not installed exactly once")
          api.write_text(text, encoding="utf-8")
          Path(".github/workflows/one-time-auth-request-fix.yml").unlink()
          PY

      - name: Validate guarded patch
        run: node --check src/vps-api.js

      - name: Commit auth request dedupe
        run: |
          set -euo pipefail
          git config user.name "Kitchen OS CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/vps-api.js .github/workflows/one-time-auth-request-fix.yml
          git commit -m "Dedupe concurrent auth refresh requests"
          git push origin HEAD:main
