name: Patch branch work minimum stocktake boundary

on:
  push:
    branches:
      - fix-branch-work-minimum-stocktake-boundary-20260907
    paths:
      - ".github/workflows/patch-branch-work-minimum-boundary.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply branch work minimum patch
        run: python3 scripts/patch-branch-work-minimum-boundary.py
      - name: Validate patched JavaScript
        run: |
          node --check src/app.js
          node --check tests/browser-regression.mjs
      - name: Commit patched source and regression
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js tests/browser-regression.mjs
          git commit -m "Enforce branch work minimum stocktake boundary"
          git push origin HEAD:fix-branch-work-minimum-stocktake-boundary-20260907
