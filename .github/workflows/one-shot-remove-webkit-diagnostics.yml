name: One-shot WebKit diagnostics cleanup

on:
  push:
    paths:
      - ".github/workflows/one-shot-remove-webkit-diagnostics.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Remove temporary diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/mobile-role-site-certification.mjs')
          text = path.read_text()
          login_line = '    console.log("MOBILE_ROLE_SITE_LOGIN_FALLBACK", label);\n'
          response_block = '''  page.on("response", (response) => {\n    const site = inventorySiteFromUrl(response.url());\n    if (site) console.log("MOBILE_ROLE_SITE_INVENTORY_RESPONSE", label, site, response.status());\n  });\n'''
          if text.count(login_line) != 1:
              raise SystemExit(f'login diagnostic count={text.count(login_line)}')
          if text.count(response_block) != 1:
              raise SystemExit(f'response diagnostic count={text.count(response_block)}')
          text = text.replace(login_line, '').replace(response_block, '')
          path.write_text(text)
          PY
      - name: Validate clean certification
        run: node --check tests/mobile-role-site-certification.mjs
      - name: Commit cleanup and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-remove-webkit-diagnostics.yml
          git add tests/mobile-role-site-certification.mjs
          git commit -m "Remove temporary WebKit inventory diagnostics"
          git push origin HEAD:${{ github.ref_name }}
