name: One-shot inventory auth retry patch

on:
  push:
    paths:
      - ".github/workflows/one-shot-inventory-auth-retry.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add bounded AUTH_REQUIRED inventory retry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/inventory-cloud.js")
          text = path.read_text()
          a = "const MIGRATION_RETRY_MS = 5000;"
          b = "const MIGRATION_RETRY_MS = 5000;\nconst AUTH_SYNC_RETRY_MS = 5500;"
          if text.count(a) != 1: raise SystemExit("migration retry anchor mismatch")
          text = text.replace(a, b)
          a = "let polling = 0;\nlet bootedUserId = \"\";"
          b = "let polling = 0;\nlet authSyncRetryTimer = 0;\nlet bootedUserId = \"\";"
          if text.count(a) != 1: raise SystemExit("runtime timer anchor mismatch")
          text = text.replace(a, b)
          a = "function dispatchStatus(status, detail = {}) {\n  window.dispatchEvent(new CustomEvent(\"shitu:inventory-cloud-status\", {\n    detail: { status, ...detail },\n  }));\n}\n"
          b = a + "\nfunction clearAuthSyncRetry() {\n  if (!authSyncRetryTimer) return;\n  window.clearTimeout(authSyncRetryTimer);\n  authSyncRetryTimer = 0;\n}\n\nfunction scheduleAuthSyncRetry(site) {\n  if (authSyncRetryTimer || !site || !session()) return;\n  authSyncRetryTimer = window.setTimeout(() => {\n    authSyncRetryTimer = 0;\n    if (document.documentElement.dataset.vpsAuthReady !== \"true\" || !session()) return;\n    void syncInventoryNow(currentSite() || site);\n  }, AUTH_SYNC_RETRY_MS);\n}\n"
          if text.count(a) != 1: raise SystemExit("status helper anchor mismatch")
          text = text.replace(a, b)
          a = "    const rows = await fetchSite(site);\n    const changed = site === \"central\" ? applyCentral(rows) : applyBranch(rows, site);"
          b = "    const rows = await fetchSite(site);\n    clearAuthSyncRetry();\n    const changed = site === \"central\" ? applyCentral(rows) : applyBranch(rows, site);"
          if text.count(a) != 1: raise SystemExit("successful sync anchor mismatch")
          text = text.replace(a, b)
          a = "  } catch (error) {\n    dispatchStatus(\"error\", { site, error: error?.message || String(error) });\n    return false;\n  }\n}\n\nexport function syncInventoryNow"
          b = "  } catch (error) {\n    if (error?.code === \"AUTH_REQUIRED\") scheduleAuthSyncRetry(site);\n    dispatchStatus(\"error\", { site, error: error?.message || String(error) });\n    return false;\n  }\n}\n\nexport function syncInventoryNow"
          if text.count(a) != 1: raise SystemExit("sync catch anchor mismatch")
          text = text.replace(a, b)
          path.write_text(text)
          PY
      - name: Run targeted inventory regressions
        run: |
          node tests/inventory-auth-grace-retry-regression.mjs
          node tests/inventory-sync-serialization-regression.mjs
          node tests/inventory-empty-snapshot-regression.mjs
          node tests/inventory-hydration-authority-regression.mjs
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-inventory-auth-retry.yml
          git add src/inventory-cloud.js tests docs
          git commit -m "Retry inventory sync after login-grace auth race"
          git push origin HEAD:${{ github.ref_name }}
