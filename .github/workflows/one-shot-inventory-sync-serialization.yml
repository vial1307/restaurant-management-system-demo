name: One-shot inventory sync serialization patch

on:
  push:
    branches:
      - fix-inventory-sync-serialization-20260909
    paths:
      - ".github/workflows/one-shot-inventory-sync-serialization.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix-inventory-sync-serialization-20260909

      - name: Apply inventory sync serialization
        run: python3 .github/scripts/patch-inventory-sync-serialization.py

      - name: Validate targeted regression
        run: |
          set -euo pipefail
          node --check src/inventory-cloud.js
          node tests/inventory-sync-serialization-regression.mjs
          node tests/vps-inventory-cache-invalidation-regression.mjs

      - name: Commit patch
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-inventory-sync-serialization.yml
          git rm .github/scripts/patch-inventory-sync-serialization.py
          git add src/inventory-cloud.js tests/inventory-sync-serialization-regression.mjs docs/spec-deltas/2026-09-09-inventory-sync-serialization.md .github/workflows/deploy-vps.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Serialize inventory sync requests without dropping refreshes"
          git push origin HEAD:fix-inventory-sync-serialization-20260909
