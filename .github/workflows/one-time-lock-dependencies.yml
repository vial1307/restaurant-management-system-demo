name: One-time dependency lock migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-lock-dependencies.yml'

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Generate deterministic lockfiles only
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix vps/backend
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix tests
          test -s vps/backend/package-lock.json
          test -s tests/package-lock.json
      - name: Commit exactly two lockfiles
        run: |
          set -euo pipefail
          git config user.name 'Kitchen OS CI'
          git config user.email 'actions@users.noreply.github.com'
          git add vps/backend/package-lock.json tests/package-lock.json
          ACTUAL="$(git diff --cached --name-only | sort)"
          EXPECTED="$(printf '%s\n' tests/package-lock.json vps/backend/package-lock.json | sort)"
          test "$ACTUAL" = "$EXPECTED"
          git commit -m 'Pin backend and browser test dependencies'
          git push origin HEAD:main
