name: Patch catalog stocktake boundary

on:
  push:
    branches:
      - fix-catalog-stocktake-bypass-20260907
    paths:
      - .github/workflows/patch-catalog-stocktake-bypass.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 scripts/patch-catalog-stocktake-bypass.py

      - name: Validate JavaScript
        run: |
          node --check src/app.js
          node --check src/inventory-cloud.js
          node --check vps/backend/src/inventory-extra-routes.mjs

      - name: Commit patched source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js src/inventory-cloud.js vps/backend/src/inventory-extra-routes.mjs
          git commit -m "Close catalog stocktake permission bypass"
          git push origin HEAD:fix-catalog-stocktake-bypass-20260907
