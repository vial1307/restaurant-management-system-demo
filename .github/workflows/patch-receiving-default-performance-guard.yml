name: Patch receiving-default performance guard

on:
  push:
    branches:
      - fix-receiving-default-manager-boundary-20260907
    paths:
      - ".github/workflows/patch-receiving-default-performance-guard.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Update performance guard
        run: python3 scripts/patch-receiving-default-performance-guard.py
      - name: Validate performance regression
        run: node tests/performance-regression.mjs
      - name: Commit updated guard
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/performance-regression-core.mjs
          git commit -m "Update receiving-default performance guard"
          git push origin HEAD:fix-receiving-default-manager-boundary-20260907
