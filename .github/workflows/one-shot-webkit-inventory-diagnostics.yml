name: One-shot WebKit inventory diagnostics

on:
  push:
    paths:
      - ".github/workflows/one-shot-webkit-inventory-diagnostics.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Add focused login and inventory-response diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/mobile-role-site-certification.mjs')
          text = path.read_text()
          old = '  } catch (uiError) {\n    // WebKit in CI can occasionally drop the login cookie during a form navigation.'
          new = '  } catch (uiError) {\n    console.log("MOBILE_ROLE_SITE_LOGIN_FALLBACK", label);\n    // WebKit in CI can occasionally drop the login cookie during a form navigation.'
          if text.count(old) != 1:
              raise SystemExit(f'login fallback anchor count={text.count(old)}')
          text = text.replace(old, new)
          old2 = '  page.on("request", (request) => {\n    const site = inventorySiteFromUrl(request.url());\n    if (site) requestedSites.push(site);\n  });'
          new2 = '  page.on("request", (request) => {\n    const site = inventorySiteFromUrl(request.url());\n    if (site) requestedSites.push(site);\n  });\n  page.on("response", (response) => {\n    const site = inventorySiteFromUrl(response.url());\n    if (site) console.log("MOBILE_ROLE_SITE_INVENTORY_RESPONSE", label, site, response.status());\n  });'
          if text.count(old2) != 1:
              raise SystemExit(f'request listener anchor count={text.count(old2)}')
          path.write_text(text.replace(old2, new2))
          PY
      - name: Validate source
        run: node --check tests/mobile-role-site-certification.mjs
      - name: Commit diagnostics and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-webkit-inventory-diagnostics.yml
          git add tests/mobile-role-site-certification.mjs
          git commit -m "Instrument WebKit inventory certification"
          git push origin HEAD:${{ github.ref_name }}
