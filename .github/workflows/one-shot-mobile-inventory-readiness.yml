name: One-shot mobile inventory readiness patch

on:
  push:
    paths:
      - ".github/workflows/one-shot-mobile-inventory-readiness.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for rendered Manage row before stocktake assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tests/mobile-role-site-certification.mjs")
          text = path.read_text()
          anchor = "    await manage.click();\n    const directControls = await page.locator('[data-manage-adjust=\"true\"]').count();"
          replacement = "    await manage.click();\n    const edit = page.locator('[data-action=\"open-edit-item\"]').first();\n    await edit.waitFor({ state:\"visible\", timeout:10000 });\n    const directControls = await page.locator('[data-manage-adjust=\"true\"]').count();"
          if text.count(anchor) != 1:
              raise SystemExit(f"expected one branch manage anchor, found {text.count(anchor)}")
          text = text.replace(anchor, replacement)
          duplicate = "\n    const edit = page.locator('[data-action=\"open-edit-item\"]').first();\n    await edit.waitFor({ state:\"visible\", timeout:10000 });\n    await edit.click();"
          if text.count(duplicate) != 1:
              raise SystemExit(f"expected one duplicate edit wait block, found {text.count(duplicate)}")
          text = text.replace(duplicate, "\n    await edit.click();")
          path.write_text(text)
          PY
      - name: Validate certification source
        run: node --check tests/mobile-role-site-certification.mjs
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-mobile-inventory-readiness.yml
          git add tests/mobile-role-site-certification.mjs docs/spec-deltas/2026-09-09-mobile-inventory-certification-readiness.md
          git commit -m "Wait for inventory Manage rows before role assertions"
          git push origin HEAD:${{ github.ref_name }}
