name: Fix PR47 scoped API observation

on:
  push:
    branches:
      - test-mobile-role-site-certification-v2-20260907

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: test-mobile-role-site-certification-v2-20260907
          fetch-depth: 0
      - name: Make scoped inventory observation deterministic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/mobile-role-site-certification.mjs')
          text = path.read_text(encoding='utf-8')
          old = '''async function gotoInventory(page) {
  await page.goto(`${BASE}/#inventory`, { waitUntil:"domcontentloaded", timeout:30000 });
  await page.waitForSelector(".page-content", { state:"visible", timeout:15000 });
  await page.waitForFunction(() => localStorage.getItem("shitu-inventory-cloud-v2") === "ready", null, { timeout:15000 });
  await page.waitForTimeout(150);
}
'''
          new = '''async function gotoInventory(page, { forceBootstrap = false } = {}) {
  await page.goto(`${BASE}/#inventory`, { waitUntil:"domcontentloaded", timeout:30000 });
  // A hash-only navigation can reuse inventory already fetched during login bootstrap.
  // Reload when certifying API site scope so request observation cannot race login.
  if (forceBootstrap) await page.reload({ waitUntil:"domcontentloaded", timeout:30000 });
  await page.waitForSelector(".page-content", { state:"visible", timeout:15000 });
  await page.waitForFunction(() => localStorage.getItem("shitu-inventory-cloud-v2") === "ready", null, { timeout:15000 });
  await page.waitForTimeout(150);
}
'''
          if old not in text:
              raise SystemExit('gotoInventory block not found exactly once')
          text = text.replace(old, new, 1)
          old_call = '''    requestedSites.length = 0;
    await gotoInventory(page);
'''
          new_call = '''    requestedSites.length = 0;
    await gotoInventory(page, { forceBootstrap:true });
'''
          if old_call not in text:
              raise SystemExit('scoped API call site not found')
          text = text.replace(old_call, new_call, 1)
          path.write_text(text, encoding='utf-8')

          Path('.github/workflows/fix-pr47-scoped-api-observation.yml').unlink()
          PY
      - name: Validate patch
        shell: bash
        run: |
          node --check tests/mobile-role-site-certification.mjs
          grep -q 'forceBootstrap:true' tests/mobile-role-site-certification.mjs
          grep -q 'request observation cannot race login' tests/mobile-role-site-certification.mjs
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/mobile-role-site-certification.mjs .github/workflows/fix-pr47-scoped-api-observation.yml
          git commit -m 'Make mobile site-scope API certification deterministic'
          git push origin HEAD:test-mobile-role-site-certification-v2-20260907
