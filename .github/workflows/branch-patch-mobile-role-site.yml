name: One-shot mobile role-site certification patch

on:
  push:
    branches:
      - test-mobile-role-site-certification-20260906

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: test-mobile-role-site-certification-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Patch production regression workflow only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/deploy-vps.yml')
          text = path.read_text()
          anchor = '''      - name: Desktop and mobile Chromium regression
                run: node tests/browser-regression.mjs

              - name: Business recovery notice browser regression
          '''
          replacement = '''      - name: Desktop and mobile Chromium regression
                run: node tests/browser-regression.mjs

              - name: Mobile role and site certification
                run: node tests/mobile-role-site-certification.mjs

              - name: Business recovery notice browser regression
          '''
          assert text.count(anchor) == 1, 'Chromium regression anchor changed'
          assert 'Mobile role and site certification' not in text, 'mobile certification already wired'
          path.write_text(text.replace(anchor, replacement, 1))
          PY
          node --check tests/mobile-role-site-certification.mjs
          git rm .github/workflows/branch-patch-mobile-role-site.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/deploy-vps.yml tests/mobile-role-site-certification.mjs docs/spec-deltas/2026-09-06-mobile-role-site-certification.md
          git commit -m "Certify role and site behavior on mobile"
          git push origin HEAD:test-mobile-role-site-certification-20260906
