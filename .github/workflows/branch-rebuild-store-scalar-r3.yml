name: Rebuild scalar no-op r3 on current main

on:
  push:
    branches:
      - perf-store-scalar-noop-suppression-r3-20260906
    paths:
      - ".github/workflows/branch-rebuild-store-scalar-r3.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf-store-scalar-noop-suppression-r3-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Apply corrected scalar slice onto current production base
        shell: bash
        run: |
          git fetch origin perf-store-scalar-noop-suppression-r2-20260906
          git checkout origin/perf-store-scalar-noop-suppression-r2-20260906 -- \
            src/store-core.js \
            docs/spec-deltas/2026-09-06-store-scalar-noop-suppression.md \
            tests/store-scalar-noop-regression.mjs
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/performance-regression.mjs')
          source = path.read_text()
          line = 'await import("./store-scalar-noop-regression.mjs");\n'
          if source.count(line) > 1:
              raise SystemExit('duplicate scalar regression import')
          if line not in source:
              source += line
          path.write_text(source)
          PY
          node tests/performance-regression.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/branch-rebuild-store-scalar-r3.yml
          git add src/store-core.js docs/spec-deltas/2026-09-06-store-scalar-noop-suppression.md tests/store-scalar-noop-regression.mjs tests/performance-regression.mjs
          git commit -m "Rebuild safe scalar no-op suppression on current main"
          git push origin HEAD:perf-store-scalar-noop-suppression-r3-20260906
