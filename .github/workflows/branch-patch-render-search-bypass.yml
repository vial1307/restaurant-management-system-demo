name: One-shot inventory render search bypass patch
# retry after optional-chaining regression fix

on:
  push:
    branches:
      - perf-inventory-render-search-bypass-20260906
    paths:
      - ".github/workflows/branch-patch-render-search-bypass.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf-inventory-render-search-bypass-20260906
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Patch render-time empty search bypass only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/app.js')
          source = path.read_text()
          old = '  if (inventorySearchInput) applyInventorySearchDom(inventorySearchInput);'
          new = '  const inventorySearchNeedle = prepareSearchNeedle(inventorySearchInput?.value || "");\n  if (inventorySearchInput && inventorySearchNeedle) applyInventorySearchDom(inventorySearchInput);'
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one render search apply line, found {count}')
          path.write_text(source.replace(old, new, 1))
          PY
          node tests/performance-regression.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/branch-patch-render-search-bypass.yml
          git add src/app.js tests docs
          git commit -m "Skip empty inventory search scan during render"
          git push origin HEAD:perf-inventory-render-search-bypass-20260906
