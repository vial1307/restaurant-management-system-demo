name: Patch mobile navigation permission

on:
  push:
    branches:
      - test-mobile-role-site-certification-v2-20260907
    paths:
      - scripts/patch-mobile-nav-permission.mjs
      - .github/workflows/patch-mobile-nav-permission.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: test-mobile-role-site-certification-v2-20260907
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply deterministic patch
        run: node scripts/patch-mobile-nav-permission.mjs
      - name: Syntax check
        run: node --check src/app.js
      - name: Verify permission gate
        run: |
          grep -F 'const allowed = accountCan(key, "view");' src/app.js
          grep -F 'hidden aria-hidden="true" tabindex="-1"' src/app.js
      - name: Commit patched source
        run: |
          if git diff --quiet -- src/app.js; then
            echo "No source change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js
          git commit -m "Enforce navigation view permissions"
          git push origin HEAD:test-mobile-role-site-certification-v2-20260907
