name: One-shot business conflict recovery patch

on:
  push:
    branches:
      - fix-business-conflict-recovery-20260908
    paths:
      - ".github/workflows/one-shot-business-conflict-recovery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix-business-conflict-recovery-20260908

      - name: Apply conflict recovery reconciliation
        run: python3 .github/patch-business-conflict-recovery.py

      - name: Validate targeted regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check src/business-state-sync.js
          node --check src/business-recovery-notice.js
          node tests/business-state-module-revision-regression.mjs
          node tests/business-recovery-metadata-regression.mjs
          node tests/business-state-reload-draft-regression.mjs
          node tests/business-state-persistence-status-regression.mjs

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-business-conflict-recovery.yml .github/patch-business-conflict-recovery.py
          git add src/business-state-sync.js src/business-recovery-notice.js tests/business-state-module-revision-regression.mjs docs/spec-deltas/2026-09-08-business-conflict-recovery.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Recover stale business conflicts without retry loops"
          git push origin HEAD:fix-business-conflict-recovery-20260908
