name: One-shot branch empty catalog patch

on:
  push:
    branches:
      - fix-branch-empty-catalog-fallback-20260909
    paths:
      - tests/branch-empty-catalog-fallback-contract-regression.mjs
      - tests/performance-regression.mjs
      - docs/spec-deltas/2026-09-09-branch-empty-catalog-fallback.md
      - .github/workflows/one-shot-branch-empty-catalog-fallback.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch branch catalog fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/inventory-cloud.js')
          source = path.read_text()
          old = '''  const inventory = Array.isArray(record?.inventory) && record.inventory.length
            ? record.inventory
            : DEFAULT_ITEMS;'''
          new = '''  const inventory = Array.isArray(record?.inventory)
            ? record.inventory
            : DEFAULT_ITEMS;'''
          if old not in source:
              raise SystemExit('expected branch catalog fallback not found')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Run targeted inventory regressions
        run: |
          node tests/branch-empty-catalog-fallback-contract-regression.mjs
          node tests/inventory-empty-snapshot-regression.mjs
          node tests/central-empty-cache-reseed-contract-regression.mjs
          node tests/inventory-history-limit-contract-regression.mjs
          node tests/inventory-sync-serialization-regression.mjs
          node tests/vps-inventory-cache-invalidation-regression.mjs
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/one-shot-branch-empty-catalog-fallback.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/inventory-cloud.js tests/performance-regression.mjs tests/branch-empty-catalog-fallback-contract-regression.mjs docs/spec-deltas/2026-09-09-branch-empty-catalog-fallback.md .github/workflows/one-shot-branch-empty-catalog-fallback.yml
          git commit -m 'Preserve authoritative empty branch catalog state'
          git push
