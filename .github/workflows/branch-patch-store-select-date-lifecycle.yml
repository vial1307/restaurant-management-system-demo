name: One-shot restore selectDate lifecycle

on:
  push:
    branches:
      - perf-store-scalar-noop-suppression-20260906
    paths:
      - ".github/workflows/branch-patch-store-select-date-lifecycle.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf-store-scalar-noop-suppression-20260906
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Remove selectDate no-op guard and verify performance suite
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/store-core.js')
          source = path.read_text()
          old = '    selectDate(date) {\n      if (state.selectedDate === date && state.records[date]) return state;\n      return update((draft) => {'
          new = '    selectDate(date) {\n      return update((draft) => {'
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one selectDate no-op guard, found {count}')
          path.write_text(source.replace(old, new, 1))
          PY
          node tests/performance-regression.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/branch-patch-store-select-date-lifecycle.yml
          git add src/store-core.js tests docs
          git commit -m "Preserve selectDate render lifecycle"
          git push origin HEAD:perf-store-scalar-noop-suppression-20260906
