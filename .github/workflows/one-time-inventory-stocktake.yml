name: One-time Inventory Stocktake Bridge

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-inventory-stocktake.yml"

permissions:
  contents: read

concurrency:
  group: kitchen-os-one-time-stocktake
  cancel-in-progress: false

jobs:
  stocktake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Decode and validate stocktake payload
        run: |
          set -euo pipefail
          message="$(git log -1 --pretty=%B)"
          payload_b64="$(printf '%s\n' "$message" | sed -n 's/^STOCKTAKE_B64=//p' | tail -n1)"
          test -n "$payload_b64"
          printf '%s' "$payload_b64" | base64 --decode > /tmp/stocktake.json
          node <<'NODE'
          const fs=require("fs");
          const payload=JSON.parse(fs.readFileSync("/tmp/stocktake.json","utf8"));
          if (payload?.version !== 1) throw new Error("PAYLOAD_VERSION_INVALID");
          if (!/^[a-z][a-z0-9._-]{1,39}$/.test(String(payload?.site||""))) throw new Error("SITE_INVALID");
          if (!/^[a-z][a-z0-9._-]{1,79}$/.test(String(payload?.location_code||""))) throw new Error("LOCATION_INVALID");
          if (!/^\d{4}-\d{2}-\d{2}$/.test(String(payload?.counted_at||""))) throw new Error("COUNTED_AT_INVALID");
          if (!Array.isArray(payload?.items) || payload.items.length === 0 || payload.items.length > 500) throw new Error("ITEMS_INVALID");
          const keys=new Set();
          for (const row of payload.items) {
            const key=String(row?.item_key||"");
            if (!key.startsWith(`${payload.site}:`)) throw new Error(`ITEM_SITE_INVALID:${key}`);
            if (keys.has(key)) throw new Error(`DUPLICATE_ITEM:${key}`);
            keys.add(key);
            const quantity=Number(row?.quantity);
            if (!Number.isFinite(quantity) || quantity < 0) throw new Error(`QUANTITY_INVALID:${key}`);
          }
          console.log(JSON.stringify({
            site:payload.site,
            location_code:payload.location_code,
            counted_at:payload.counted_at,
            items:payload.items.length
          }));
          NODE

      - name: Configure SSH
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/kitchen_actions"
          chmod 600 "$HOME/.ssh/kitchen_actions"
          ssh-keyscan -H 82.47.180.185 >> "$HOME/.ssh/known_hosts"

      - name: Back up production database
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/kitchen_actions" -o BatchMode=yes -o ConnectTimeout=15 deploy@82.47.180.185 '
            set -euo pipefail
            cd /opt/kitchen-os
            set -a
            source .env
            set +a
            out="/home/deploy/kitchen_os_pre_stocktake_$(date -u +%Y%m%dT%H%M%SZ).dump"
            docker compose --env-file .env exec -T db pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc > "$out"
            test -s "$out"
            sha256sum "$out" > "$out.sha256"
            echo "backup=$out"
          '

      - name: Copy stocktake payload
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/kitchen_actions" -o BatchMode=yes -o ConnectTimeout=15 \
            /tmp/stocktake.json deploy@82.47.180.185:/home/deploy/.kitchen-stocktake.json
          ssh -i "$HOME/.ssh/kitchen_actions" -o BatchMode=yes -o ConnectTimeout=15 deploy@82.47.180.185 '
            set -euo pipefail
            docker cp /home/deploy/.kitchen-stocktake.json kitchen-os-api:/tmp/kitchen-stocktake.json
          '

      - name: Apply stocktake transactionally
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/kitchen_actions" -o BatchMode=yes -o ConnectTimeout=15 deploy@82.47.180.185 \
            'cd /opt/kitchen-os && docker compose --env-file .env exec -T app node --input-type=module -' <<'NODE'
          import fs from "node:fs";
          import { pool, withTransaction } from "./src/db.mjs";

          const payload=JSON.parse(fs.readFileSync("/tmp/kitchen-stocktake.json","utf8"));
          const site=String(payload.site||"");
          const locationCode=String(payload.location_code||"");
          const countedAt=String(payload.counted_at||"");
          const rows=Array.isArray(payload.items) ? payload.items : [];
          const actor=`system:stocktake-${countedAt}`;

          try {
            const result=await withTransaction(async (client) => {
              const locationResult=await client.query(
                `select id,site,code,kind,active
                   from public.inventory_locations
                  where site=$1 and code=$2 and kind='storage' and active=true
                  limit 2
                  for update`,
                [site,locationCode]
              );
              if (locationResult.rowCount !== 1) {
                throw new Error(`STOCKTAKE_LOCATION_INVALID:${site}:${locationCode}:${locationResult.rowCount}`);
              }
              const locationId=locationResult.rows[0].id;

              const duplicates=new Set();
              const seen=new Set();
              for (const row of rows) {
                const key=String(row?.item_key||"");
                if (seen.has(key)) duplicates.add(key);
                seen.add(key);
              }
              if (duplicates.size) throw new Error(`STOCKTAKE_DUPLICATE_ITEM:${[...duplicates].join(",")}`);

              const missing=[];
              const inactive=[];
              for (const row of rows) {
                const key=String(row.item_key||"");
                if (!key.startsWith(site + ":")) throw new Error(`STOCKTAKE_ITEM_SITE_MISMATCH:${key}`);
                const item=await client.query(
                  `select id,item_key,unit,active
                     from public.inventory_items
                    where item_key=$1
                    limit 1
                    for update`,
                  [key]
                );
                if (!item.rowCount) missing.push(key);
                else if (!item.rows[0].active) inactive.push(key);
              }
              if (missing.length) throw new Error(`STOCKTAKE_ITEM_MISSING:${missing.join(",")}`);
              if (inactive.length) throw new Error(`STOCKTAKE_ITEM_INACTIVE:${inactive.join(",")}`);

              let changed=0;
              let unchanged=0;
              const details=[];

              for (const row of rows) {
                const itemResult=await client.query(
                  `select id,item_key,unit
                     from public.inventory_items
                    where item_key=$1 and active=true
                    limit 1`,
                  [String(row.item_key)]
                );
                const item=itemResult.rows[0];
                const target=Number(row.quantity);
                if (!Number.isFinite(target) || target < 0) {
                  throw new Error(`STOCKTAKE_QUANTITY_INVALID:${row.item_key}`);
                }

                await client.query(
                  `insert into public.inventory_stock(item_id,location_id,quantity,minimum_quantity,updated_at)
                   values($1,$2,0,0,now())
                   on conflict(item_id,location_id) do nothing`,
                  [item.id,locationId]
                );
                const stock=await client.query(
                  `select quantity
                     from public.inventory_stock
                    where item_id=$1 and location_id=$2
                    for update`,
                  [item.id,locationId]
                );
                const before=Number(stock.rows[0]?.quantity||0);

                if (before !== target) {
                  await client.query(
                    `update public.inventory_stock
                        set quantity=$3,updated_at=now()
                      where item_id=$1 and location_id=$2`,
                    [item.id,locationId,target]
                  );
                  await client.query(
                    `insert into public.inventory_transactions(
                       item_id,source_location_id,destination_location_id,action,amount,note,
                       actor_user_id,actor_username,metadata
                     ) values(
                       $1,$2,$3,'adjust',$4,$5,null,$6,
                       jsonb_build_object(
                         'source','user_stocktake',
                         'site',$7::text,
                         'location_code',$8::text,
                         'counted_at',$9::text,
                         'raw_detail',$10::text,
                         'before_quantity',$11::numeric,
                         'after_quantity',$12::numeric,
                         'unit',$13::text
                       )
                     )`,
                    [
                      item.id,
                      target < before ? locationId : null,
                      target >= before ? locationId : null,
                      Math.abs(target-before),
                      `大冷凍盤點 ${countedAt} / Kiểm kê tủ đông lớn ${countedAt}`,
                      actor,site,locationCode,countedAt,String(row.raw_detail||""),
                      before,target,String(item.unit||"")
                    ]
                  );
                  changed++;
                } else {
                  unchanged++;
                }
                details.push({item_key:item.item_key,before,after:target,unit:item.unit,changed:before!==target});
              }

              const verify=await client.query(
                `select i.item_key,s.quantity
                   from public.inventory_items i
                   join public.inventory_stock s on s.item_id=i.id
                  where s.location_id=$1
                    and i.item_key=any($2::text[])`,
                [locationId,rows.map((row)=>String(row.item_key))]
              );
              const actual=new Map(verify.rows.map((row)=>[row.item_key,Number(row.quantity)]));
              const mismatch=rows.filter((row)=>actual.get(String(row.item_key)) !== Number(row.quantity));
              if (mismatch.length) {
                throw new Error(`STOCKTAKE_VERIFY_FAILED:${mismatch.map((row)=>row.item_key).join(",")}`);
              }

              await client.query(
                `insert into public.audit_logs(
                   actor_user_id,actor_username,action,entity_type,entity_id,site,
                   before_data,after_data,metadata
                 ) values(
                   null,$1,'stocktake_import','inventory_location',$2,$3,null,
                   jsonb_build_object(
                     'rows_total',$4::int,
                     'rows_changed',$5::int,
                     'rows_unchanged',$6::int,
                     'location_code',$7::text
                   ),
                   jsonb_build_object(
                     'source','user_stocktake',
                     'counted_at',$8::text,
                     'mixed_unit_policy','configured stock unit retained; residual grams/pieces preserved in transaction raw_detail; no conversion inferred unless already defined'
                   )
                 )`,
                [actor,locationId,site,rows.length,changed,unchanged,locationCode,countedAt]
              );

              return {site,location_code:locationCode,counted_at:countedAt,rows:rows.length,changed,unchanged,details};
            });

            console.log("STOCKTAKE_RESULT=" + JSON.stringify(result));
          } finally {
            await pool.end();
          }
          NODE

      - name: Cleanup temporary payload
        if: always()
        run: |
          ssh -i "$HOME/.ssh/kitchen_actions" -o BatchMode=yes -o ConnectTimeout=15 deploy@82.47.180.185 '
            rm -f /home/deploy/.kitchen-stocktake.json
            docker exec kitchen-os-api rm -f /tmp/kitchen-stocktake.json >/dev/null 2>&1 || true
          ' || true
