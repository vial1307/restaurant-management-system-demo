name: One-shot inventory schema contract patch

on:
  push:
    branches:
      - codex/database-driven-inventory-master-data
    paths:
      - .github/workflows/schema12-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/database-driven-inventory-master-data
      - name: Align frontend inventory schema contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'const REQUIRED_SCHEMA_VERSION = 11;' src/inventory-cloud.js
          sed -i 's/const REQUIRED_SCHEMA_VERSION = 11;/const REQUIRED_SCHEMA_VERSION = 12;/' src/inventory-cloud.js
          grep -q 'const REQUIRED_SCHEMA_VERSION = 12;' src/inventory-cloud.js
      - name: Commit exact one-line patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/inventory-cloud.js
          git diff --cached --check
          git diff --cached --exit-code --quiet && exit 0
          git commit -m 'fix: require inventory schema 12 in frontend'
          git push origin HEAD:codex/database-driven-inventory-master-data
