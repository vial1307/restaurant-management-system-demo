name: Patch receiving-default manager boundary

on:
  push:
    branches:
      - fix-receiving-default-manager-boundary-20260907
    paths:
      - ".github/workflows/patch-receiving-default-manager-boundary.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply receiving-default boundary patch
        run: python3 scripts/patch-receiving-default-manager-boundary.py
      - name: Validate patched JavaScript
        run: |
          node --check src/app.js
          node --check src/inventory-cloud.js
          node --check tests/browser-regression.mjs
          node --check vps/backend/src/inventory-extra-routes.mjs
          node --check vps/backend/scripts/api-regression-v6.mjs
      - name: Commit patched source and regression
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js src/inventory-cloud.js tests/browser-regression.mjs docs/SYSTEM_SPECIFICATION.md vps/backend/src/inventory-extra-routes.mjs vps/backend/scripts/api-regression-v6.mjs
          git commit -m "Enforce receiving-default manager boundary"
          git push origin HEAD:fix-receiving-default-manager-boundary-20260907
