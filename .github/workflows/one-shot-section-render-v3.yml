name: One-shot section render v3 app patch

on:
  push:
    branches:
      - perf-section-render-api-v3-20260908
    paths:
      - ".github/workflows/one-shot-section-render-v3.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: perf-section-render-api-v3-20260908

      - name: Patch current render composition
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/app.js")
          lines = path.read_text(encoding="utf-8").splitlines()
          matches = [i for i, line in enumerate(lines) if line.startswith('  root.innerHTML = `<div class="app-shell">${sidebar(context, active)}')]
          if len(matches) != 1:
              raise SystemExit(f"expected one current render anchor, found {len(matches)}")
          i = matches[0]
          lines[i:i+1] = [
              '  const sidebarMarkup = sidebar(context, active);',
              '  const topbarMarkup = topbar(context);',
              '  const pageMarkup = `<main class="page-content">${pages[active](context)}</main>`;',
              '  const mobileNavMarkup = `<nav class="mobile-nav">${ROUTES.map((key) => navItem(key, active, context.text)).join("")}</nav>`;',
              '  const overlaysMarkup = `${mobileMenu}${view.modal === "add-item" ? addItemModal(context) : ""}${view.managementModal ? management.managementModal(context) : ""}`;',
              '  if (typeof root.renderSections === "function") {',
              '    root.renderSections({ sidebar: sidebarMarkup, topbar: topbarMarkup, page: pageMarkup, mobileNav: mobileNavMarkup, overlays: overlaysMarkup });',
              '  } else root.innerHTML = `<div class="app-shell">${sidebarMarkup}<div class="main-shell">${topbarMarkup}${pageMarkup}</div>${mobileNavMarkup}</div>${overlaysMarkup}`;',
          ]
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          rm .github/workflows/one-shot-section-render-v3.yml

      - name: Validate targeted contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check src/app.js
          node --check src/stable-app-root.js
          node --check tests/section-render-api-contract-regression.mjs
          node tests/performance-regression.mjs
          node tests/static-regression.mjs

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use section renderer on current production shell"
          git push origin HEAD:perf-section-render-api-v3-20260908
