name: One-shot inventory history limit patch

on:
  push:
    branches:
      - fix-inventory-history-limit-contract-20260909
    paths:
      - ".github/workflows/one-shot-inventory-history-limit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix-inventory-history-limit-contract-20260909

      - name: Apply inventory history limit patch
        run: python3 .github/scripts/patch-inventory-history-limit.py

      - name: Validate targeted regression
        run: |
          set -euo pipefail
          node --check src/inventory-cloud.js
          node tests/inventory-history-limit-contract-regression.mjs
          node tests/inventory-empty-snapshot-regression.mjs
          node tests/inventory-sync-serialization-regression.mjs
          node tests/vps-inventory-cache-invalidation-regression.mjs

      - name: Commit patch
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-inventory-history-limit.yml
          git rm .github/scripts/patch-inventory-history-limit.py
          git add src/inventory-cloud.js tests/performance-regression.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Forward inventory history limit through options contract"
          git push origin HEAD:fix-inventory-history-limit-contract-20260909
