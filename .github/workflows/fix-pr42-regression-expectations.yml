name: Update PR42 regression expectations

on:
  push:
    branches:
      - fix-catalog-stocktake-bypass-20260907
    paths:
      - .github/workflows/fix-pr42-regression-expectations.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Update regression expectations
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('tests/catalog-stocktake-boundary-regression.mjs')
          s = p.read_text(encoding='utf-8')
          old = r'/data-manage-adjust === \"true\" && canManageBranchCatalog\\(activeInventorySite\\(\\)\\) && canDirectInventoryAdjust\\(\\)/'
          new = r'/element\\.dataset\\.manageAdjust === \"true\" && canManageBranchCatalog\\(activeInventorySite\\(\\)\\) && canDirectInventoryAdjust\\(\\)/'
          if old not in s:
              raise SystemExit('static regression anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('tests/browser-regression.mjs')
          s = p.read_text(encoding='utf-8')
          old = '''      await manage.click();
      assert((await page.locator('[data-manage-adjust="true"]').count()) > 0,`${username} missing management quantity controls`);'''
          new = '''      await manage.click();
      const manageQuantityControls=await page.locator('[data-manage-adjust="true"]').count();
      if(checks.stocktake === true){
        assert(manageQuantityControls > 0,`${username} missing management quantity controls`);
      }
      if(checks.stocktake === false){
        assert.equal(manageQuantityControls,0,`${username} must not receive stocktake quantity controls`);
      }'''
          if old not in s:
              raise SystemExit('browser manage anchor not found')
          s = s.replace(old, new, 1)
          s = s.replace('await roleDesktop(browser,"managerfx",{manage:true,operations:true,dashboardEdit:true});', 'await roleDesktop(browser,"managerfx",{manage:true,operations:true,stocktake:true,dashboardEdit:true});', 1)
          s = s.replace('await roleDesktop(browser,"employeefx",{manage:true,operations:true,dashboardEdit:false});', 'await roleDesktop(browser,"employeefx",{manage:true,operations:true,stocktake:false,dashboardEdit:false});', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate tests
        run: |
          node --check tests/catalog-stocktake-boundary-regression.mjs
          node --check tests/browser-regression.mjs
      - name: Commit test updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/catalog-stocktake-boundary-regression.mjs tests/browser-regression.mjs
          git commit -m "Align stocktake regression expectations"
          git push origin HEAD:fix-catalog-stocktake-bypass-20260907
