name: One-shot authoritative empty inventory snapshot patch

on:
  push:
    branches:
      - fix-inventory-empty-snapshot-authority-20260909
    paths:
      - ".github/workflows/one-shot-inventory-empty-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix-inventory-empty-snapshot-authority-20260909

      - name: Apply authoritative empty snapshot handling
        run: python3 .github/scripts/patch-inventory-empty-snapshot.py

      - name: Validate targeted regressions
        run: |
          set -euo pipefail
          node --check src/inventory-cloud.js
          node tests/inventory-empty-snapshot-regression.mjs
          node tests/inventory-sync-serialization-regression.mjs
          node tests/vps-inventory-cache-invalidation-regression.mjs

      - name: Commit patch
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-inventory-empty-snapshot.yml
          git rm .github/scripts/patch-inventory-empty-snapshot.py
          git add src/inventory-cloud.js tests/inventory-empty-snapshot-regression.mjs docs/spec-deltas/2026-09-09-inventory-empty-snapshot-authority.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply authoritative empty inventory snapshots"
          git push origin HEAD:fix-inventory-empty-snapshot-authority-20260909
