name: One-shot prepared search empty-query patch

on:
  push:
    branches:
      - perf-inventory-search-prepared-corpus-20260906

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf-inventory-search-prepared-corpus-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Patch empty-query short circuit only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/app.js")
          text = path.read_text()
          old = 'const visible = preparedSearchMatches(inventoryRowSearchCorpus(row), needle);'
          new = 'const visible = !needle || preparedSearchMatches(inventoryRowSearchCorpus(row), needle);'
          assert text.count(old) == 2, f"expected exactly 2 prepared row-match call sites, found {text.count(old)}"
          text = text.replace(old, new)
          path.write_text(text)
          PY

          node tests/performance-regression.mjs

          git rm .github/workflows/branch-patch-prepared-search-empty.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js
          git commit -m "Skip corpus work for empty inventory search"
          git push origin HEAD:perf-inventory-search-prepared-corpus-20260906
