name: One-shot inventory read-after-write cache patch

on:
  push:
    branches:
      - fix-inventory-read-after-write-cache-20260909
    paths:
      - ".github/workflows/one-shot-inventory-read-after-write-cache.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix-inventory-read-after-write-cache-20260909

      - name: Apply inventory cache patch
        run: python3 .github/scripts/patch-inventory-read-after-write-cache.py

      - name: Validate targeted regression
        run: |
          set -euo pipefail
          node --check src/vps-api.js
          node tests/vps-inventory-cache-invalidation-regression.mjs
          node tests/performance-regression.mjs

      - name: Commit patch
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-inventory-read-after-write-cache.yml
          git rm .github/scripts/patch-inventory-read-after-write-cache.py
          git add src/vps-api.js tests/vps-inventory-cache-invalidation-regression.mjs tests/performance-regression.mjs docs/spec-deltas/2026-09-09-inventory-read-after-write-cache.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Invalidate inventory cache after successful writes"
          git push origin HEAD:fix-inventory-read-after-write-cache-20260909
