name: VPS Capacity Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/vps-capacity-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require VPS SSH secret
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: test -n "$VPS_SSH_KEY"

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/kitchen_actions"
          chmod 600 "$HOME/.ssh/kitchen_actions"
          ssh-keyscan -H 82.47.180.185 >> "$HOME/.ssh/known_hosts"

      - name: Read-only VPS capacity and runtime audit
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/kitchen_actions" -o BatchMode=yes -o ConnectTimeout=15 deploy@82.47.180.185 'bash -s' <<'REMOTE'
          set -u

          summarize_ms() {
            awk '{ sum += $1; if (NR == 1 || $1 < min) min = $1; if (NR == 1 || $1 > max) max = $1 } END { if (NR) printf "samples=%d min=%.1fms avg=%.1fms max=%.1fms\n", NR, min*1000, (sum/NR)*1000, max*1000 }'
          }

          echo '=== AUDIT_TIME ==='
          date -u '+%Y-%m-%dT%H:%M:%SZ'

          echo '=== OS ==='
          uname -a
          if test -r /etc/os-release; then
            grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release || true
          fi

          echo '=== CPU ==='
          printf 'vCPU: '
          nproc
          lscpu 2>/dev/null | grep -E '^(Model name|Architecture|CPU\(s\)|Thread\(s\) per core|Core\(s\) per socket|Socket\(s\)|Virtualization|Hypervisor vendor):' || true

          echo '=== MEMORY ==='
          free -h
          echo '-- swap --'
          swapon --show 2>/dev/null || true

          echo '=== LOAD_UPTIME ==='
          uptime
          cat /proc/loadavg

          echo '=== FILESYSTEM ==='
          df -hT /
          df -i /
          echo '-- block devices --'
          lsblk -o NAME,SIZE,TYPE,FSTYPE,MOUNTPOINTS 2>/dev/null || true

          echo '=== KITCHEN_OS_STORAGE ==='
          du -sh /opt/kitchen-os 2>/dev/null || true
          du -sh /opt/kitchen-os/backups 2>/dev/null || true
          printf 'backup_count: '
          find /opt/kitchen-os/backups -maxdepth 1 -type f -name 'kitchen_os_*.dump' 2>/dev/null | wc -l || true
          echo '-- newest backups --'
          find /opt/kitchen-os/backups -maxdepth 1 -type f -name 'kitchen_os_*.dump' -printf '%TY-%Tm-%Td %TH:%TM:%TS %s %p\n' 2>/dev/null | sort -r | head -n 10 || true

          echo '=== DOCKER ==='
          if docker info >/dev/null 2>&1; then
            docker version --format 'server={{.Server.Version}}' || true
            echo '-- containers --'
            docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}' || true
            echo '-- live resource usage --'
            docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}\t{{.NetIO}}\t{{.BlockIO}}\t{{.PIDs}}' || true
            echo '-- docker disk usage --'
            docker system df || true
            echo '-- postgres data volume --'
            docker exec kitchen-os-db sh -lc 'du -sh /var/lib/postgresql/data 2>/dev/null || true' || true
          else
            echo 'DOCKER_METRICS_UNAVAILABLE_FOR_DEPLOY_USER'
          fi

          echo '=== DATA_PATH_PERFORMANCE ==='
          echo '-- localhost API health (includes PostgreSQL queries) --'
          : > /tmp/kitchen_local_health_times
          for i in $(seq 1 20); do
            curl -fsS -o /dev/null -w '%{time_total}\n' http://127.0.0.1:8080/api/health >> /tmp/kitchen_local_health_times
          done
          summarize_ms < /tmp/kitchen_local_health_times

          echo '-- local Caddy edge -> API -> PostgreSQL --'
          : > /tmp/kitchen_edge_health_times
          for i in $(seq 1 20); do
            curl -fsS -o /dev/null -w '%{time_total}\n' http://127.0.0.1/api/health >> /tmp/kitchen_edge_health_times
          done
          summarize_ms < /tmp/kitchen_edge_health_times

          echo '-- production HTTPS from VPS loopback path --'
          : > /tmp/kitchen_https_health_times
          for i in $(seq 1 10); do
            curl -fsS -o /dev/null -w '%{time_total}\n' https://82.47.180.185.nip.io/api/health >> /tmp/kitchen_https_health_times
          done
          summarize_ms < /tmp/kitchen_https_health_times

          echo '-- production static root from VPS --'
          : > /tmp/kitchen_root_times
          for i in $(seq 1 10); do
            curl -fsS -o /dev/null -w '%{time_total}\n' https://82.47.180.185.nip.io/ >> /tmp/kitchen_root_times
          done
          summarize_ms < /tmp/kitchen_root_times

          if docker info >/dev/null 2>&1; then
            echo '-- PostgreSQL representative inventory query plan/execution --'
            docker exec kitchen-os-db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -P pager=off -c "EXPLAIN (ANALYZE, BUFFERS, FORMAT TEXT) select s.item_id,s.location_id,s.quantity,s.minimum_quantity,s.updated_at from public.inventory_stock s join public.inventory_locations l on l.id=s.location_id join public.inventory_items i on i.id=s.item_id where l.site=''fuxing'' and l.active=true and i.active=true and i.item_key like ''fuxing:%'';"' || true
          fi

          echo '=== SERVICE_PORTS ==='
          ss -lnt 2>/dev/null | grep -E '(:22|:80|:443|:8080)[[:space:]]' || true

          echo '=== END ==='
          REMOTE

      - name: External production HTTPS timing from CI runner
        run: |
          set -euo pipefail
          echo '=== EXTERNAL_HTTPS_TIMING ==='
          for path in / /api/health /RELEASE; do
            echo "-- ${path} --"
            for i in $(seq 1 10); do
              curl -fsS -o /dev/null \
                -w 'dns=%{time_namelookup} connect=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total} size=%{size_download}\n' \
                "https://82.47.180.185.nip.io${path}"
            done
          done
