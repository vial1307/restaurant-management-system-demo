name: Inventory Site Production Audit

on:
  workflow_run:
    workflows:
      - "Deploy Kitchen OS to VPS"
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inventory-site-production-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kitchen-os-production-inventory-site-audit
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      DEPLOYED_HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Require VPS SSH secret
        run: test -n "$VPS_SSH_KEY"

      - name: Configure SSH
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/kitchen_actions"
          chmod 600 "$HOME/.ssh/kitchen_actions"
          ssh-keyscan -H 82.47.180.185 >> "$HOME/.ssh/known_hosts"

      - name: Audit inventory site isolation
        run: |
          set -euo pipefail
          SSH=(ssh -i "$HOME/.ssh/kitchen_actions" -o BatchMode=yes -o ConnectTimeout=15 deploy@82.47.180.185)
          "${SSH[@]}" 'cd /opt/kitchen-os && set -a && source .env && set +a && docker compose --env-file .env exec -T db psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At' <<'SQL'
          select 'release|' || coalesce((select max(version) from public.schema_migrations),'000');

          select 'site|' || l.site
                 || '|items|' || count(distinct i.id)
                 || '|stock_rows|' || count(s.*)
                 || '|quantity|' || coalesce(sum(s.quantity),0)
          from public.inventory_locations l
          left join public.inventory_stock s on s.location_id=l.id
          left join public.inventory_items i
            on i.id=s.item_id and split_part(i.item_key,':',1)=l.site
          where l.active=true
          group by l.site
          order by l.site;

          select 'stock_site_mismatch|' || count(*)
          from public.inventory_stock s
          join public.inventory_items i on i.id=s.item_id
          join public.inventory_locations l on l.id=s.location_id
          where split_part(i.item_key,':',1)<>l.site;

          select 'receive_default_site_mismatch|' || count(*)
          from public.inventory_receive_defaults d
          join public.inventory_locations l on l.id=d.location_id
          where d.site<>l.site;

          select 'unknown_item_site|' || count(*)
          from public.inventory_items i
          left join public.sites st on st.code=split_part(i.item_key,':',1)
          where st.code is null;

          select 'inactive_item_positive_stock|' || count(*)
          from public.inventory_stock s
          join public.inventory_items i on i.id=s.item_id
          where i.active=false and s.quantity>0;

          select 'inactive_item_positive_minimum|' || count(*)
          from public.inventory_stock s
          join public.inventory_items i on i.id=s.item_id
          where i.active=false and s.minimum_quantity>0;

          select 'inactive_location_positive_stock|' || count(*)
          from public.inventory_stock s
          join public.inventory_locations l on l.id=s.location_id
          where l.active=false and s.quantity>0;

          select 'inactive_location_positive_minimum|' || count(*)
          from public.inventory_stock s
          join public.inventory_locations l on l.id=s.location_id
          where l.active=false and s.minimum_quantity>0;

          select 'receive_default_inactive_or_nonstorage|' || count(*)
          from public.inventory_receive_defaults d
          join public.inventory_locations l on l.id=d.location_id
          where l.active=false or l.kind<>'storage';

          select 'receive_default_without_active_item|' || count(*)
          from public.inventory_receive_defaults d
          where not exists (
            select 1
            from public.inventory_items i
            where i.active=true
              and split_part(i.item_key,':',1)=d.site
              and i.catalog_key=d.catalog_key
          );

          select 'receive_default_not_configured|' || count(*)
          from public.inventory_receive_defaults d
          where not exists (
            select 1
            from public.inventory_items i
            join public.inventory_stock s on s.item_id=i.id
            where i.active=true
              and split_part(i.item_key,':',1)=d.site
              and i.catalog_key=d.catalog_key
              and s.location_id=d.location_id
          );

          select 'blank_catalog_key|' || count(*)
          from public.inventory_items
          where active=true and btrim(catalog_key)='';

          select 'invalid_item_key_suffix|' || count(*)
          from public.inventory_items
          where active=true and btrim(split_part(item_key,':',2))='';

          select 'duplicate_active_catalog_site_groups|' || count(*)
          from (
            select split_part(item_key,':',1) as site,catalog_key
            from public.inventory_items
            where active=true
            group by split_part(item_key,':',1),catalog_key
            having count(*)>1
          ) duplicates;

          select 'active_item_without_stock_rows|' || count(*)
          from public.inventory_items i
          where i.active=true
            and not exists (
              select 1 from public.inventory_stock s where s.item_id=i.id
            );

          select 'active_item_without_storage_rows|' || count(*)
          from public.inventory_items i
          where i.active=true
            and not exists (
              select 1
              from public.inventory_stock s
              join public.inventory_locations l on l.id=s.location_id
              where s.item_id=i.id and l.active=true and l.kind='storage'
            );

          select 'detail_duplicate_catalog|' ||
                 split_part(item_key,':',1) || '|' || catalog_key || '|count|' || count(*)
          from public.inventory_items
          where active=true
          group by split_part(item_key,':',1),catalog_key
          having count(*)>1
          order by split_part(item_key,':',1),catalog_key;

          select 'detail_hidden_stock|' || i.item_key || '|location|' || l.code
                 || '|quantity|' || s.quantity || '|minimum|' || s.minimum_quantity
          from public.inventory_stock s
          join public.inventory_items i on i.id=s.item_id
          join public.inventory_locations l on l.id=s.location_id
          where (i.active=false or l.active=false)
            and (s.quantity>0 or s.minimum_quantity>0)
          order by i.item_key,l.code;
          SQL

      - name: Enforce zero cross-site contamination
        run: |
          set -euo pipefail
          SSH=(ssh -i "$HOME/.ssh/kitchen_actions" -o BatchMode=yes -o ConnectTimeout=15 deploy@82.47.180.185)
          result="$("${SSH[@]}" 'cd /opt/kitchen-os && set -a && source .env && set +a && docker compose --env-file .env exec -T db psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At' <<'SQL'
          select
            (select count(*)
             from public.inventory_stock s
             join public.inventory_items i on i.id=s.item_id
             join public.inventory_locations l on l.id=s.location_id
             where split_part(i.item_key,':',1)<>l.site)
            +
            (select count(*)
             from public.inventory_receive_defaults d
             join public.inventory_locations l on l.id=d.location_id
             where d.site<>l.site)
            +
            (select count(*)
             from public.inventory_items i
             left join public.sites st on st.code=split_part(i.item_key,':',1)
             where st.code is null);
          SQL
          )"
          echo "inventory_site_integrity_violations=${result}"
          test "$result" = "0"

      - name: Enforce zero hidden inventory after deploy
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          SSH=(ssh -i "$HOME/.ssh/kitchen_actions" -o BatchMode=yes -o ConnectTimeout=15 deploy@82.47.180.185)
          result="$("${SSH[@]}" 'cd /opt/kitchen-os && set -a && source .env && set +a && docker compose --env-file .env exec -T db psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At' <<'SQL'
          select
            (select count(*)
             from public.inventory_stock s
             join public.inventory_items i on i.id=s.item_id
             where i.active=false and (s.quantity>0 or s.minimum_quantity>0))
            +
            (select count(*)
             from public.inventory_stock s
             join public.inventory_locations l on l.id=s.location_id
             where l.active=false and (s.quantity>0 or s.minimum_quantity>0))
            +
            (select count(*)
             from public.inventory_receive_defaults d
             join public.inventory_locations l on l.id=d.location_id
             where l.active=false or l.kind<>'storage')
            +
            (select count(*)
             from public.inventory_receive_defaults d
             where not exists (
               select 1
               from public.inventory_items i
               join public.inventory_stock s on s.item_id=i.id
               where i.active=true
                 and split_part(i.item_key,':',1)=d.site
                 and i.catalog_key=d.catalog_key
                 and s.location_id=d.location_id
             ));
          SQL
          )"
          echo "inventory_hidden_integrity_violations=${result}"
          test "$result" = "0"

      - name: Verify deployed release when triggered by deploy
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          actual="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 http://82.47.180.185/RELEASE | tr -d '[:space:]')"
          expected="${DEPLOYED_HEAD_SHA:0:7}"
          echo "actual=${actual} expected=${expected}"
          test "$actual" = "$expected"
