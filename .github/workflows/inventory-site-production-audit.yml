name: Inventory Site Production Audit

on:
  workflow_run:
    workflows:
      - "Deploy Kitchen OS to VPS"
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inventory-site-production-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kitchen-os-production-inventory-site-audit
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      DEPLOYED_HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Require VPS SSH secret
        run: test -n "$VPS_SSH_KEY"

      - name: Configure SSH
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/kitchen_actions"
          chmod 600 "$HOME/.ssh/kitchen_actions"
          ssh-keyscan -H 82.47.180.185 >> "$HOME/.ssh/known_hosts"

      - name: Audit inventory site isolation
        run: |
          set -euo pipefail
          SSH=(ssh -i "$HOME/.ssh/kitchen_actions" -o BatchMode=yes -o ConnectTimeout=15 deploy@82.47.180.185)
          "${SSH[@]}" 'sudo -n /usr/local/sbin/kitchen-os-verify inventory-1'

      - name: Enforce zero cross-site contamination
        run: |
          set -euo pipefail
          SSH=(ssh -i "$HOME/.ssh/kitchen_actions" -o BatchMode=yes -o ConnectTimeout=15 deploy@82.47.180.185)
          result="$("${SSH[@]}" 'sudo -n /usr/local/sbin/kitchen-os-verify inventory-2'
          )"
          echo "inventory_site_integrity_violations=${result}"
          test "$result" = "0"

      - name: Enforce unified storage and work-area classification
        run: |
          set -euo pipefail
          SSH=(ssh -i "$HOME/.ssh/kitchen_actions" -o BatchMode=yes -o ConnectTimeout=15 deploy@82.47.180.185)
          result="$("${SSH[@]}" 'sudo -n /usr/local/sbin/kitchen-os-verify inventory-3'
          )"
          echo "inventory_location_classification_violations=${result}"
          test "$result" = "0"

      - name: Enforce branch legacy catalog materialization
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          SSH=(ssh -i "$HOME/.ssh/kitchen_actions" -o BatchMode=yes -o ConnectTimeout=15 deploy@82.47.180.185)
          result="$("${SSH[@]}" 'sudo -n /usr/local/sbin/kitchen-os-verify inventory-4'
          )"
          echo "branch_legacy_catalog_materialization_violations=${result}"
          test "$result" = "0"

      - name: Enforce zero hidden inventory after deploy
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          SSH=(ssh -i "$HOME/.ssh/kitchen_actions" -o BatchMode=yes -o ConnectTimeout=15 deploy@82.47.180.185)
          result="$("${SSH[@]}" 'sudo -n /usr/local/sbin/kitchen-os-verify inventory-5'
          )"
          echo "inventory_hidden_integrity_violations=${result}"
          test "$result" = "0"

      - name: Verify deployed release when triggered by deploy
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          actual="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 http://82.47.180.185/RELEASE | tr -d '[:space:]')"
          expected="${DEPLOYED_HEAD_SHA:0:7}"
          echo "actual=${actual} expected=${expected}"
          test "$actual" = "$expected"
