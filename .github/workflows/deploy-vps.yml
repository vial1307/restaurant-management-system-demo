name: Deploy Kitchen OS to VPS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "src/**"
      - "tests/**"
      - "vps/**"
      - ".github/workflows/deploy-vps.yml"

permissions:
  contents: read

concurrency:
  group: kitchen-os-production
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate frontend JavaScript
        run: |
          set -euo pipefail
          for file in src/*.js tests/*.mjs; do
            node --check "$file"
          done

      - name: Full static regression
        run: node tests/static-regression.mjs

      - name: Validate backend JavaScript
        run: |
          set -euo pipefail
          for file in vps/backend/src/*.mjs vps/backend/scripts/*.mjs; do
            node --check "$file"
          done

      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            -v "$PWD/vps/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine \
            caddy validate --config /etc/caddy/Caddyfile

      - name: Validate required production files
        run: |
          set -euo pipefail
          test -f index.html
          test -f vps-entry.html
          test -f manifest.webmanifest
          test -f sw.js
          test -f vps/docker-compose.yml
          test -f vps/Caddyfile
          test -f src/vps-auth-bridge.js
          test -f vps/scripts/deploy-api.sh
          test -f vps/scripts/backup.sh
          test -f vps/scripts/migrate.sh
          test -f vps/scripts/verify-vps-data.sh
          test -f vps/database/migrations/004_restore_primary_admin.sql
          test -f vps/database/migrations/005_business_state.sql

  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kitchen_test
          POSTGRES_PASSWORD: kitchen_test
          POSTGRES_DB: kitchen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kitchen_test -d kitchen_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      POSTGRES_DB: kitchen_test
      POSTGRES_USER: kitchen_test
      POSTGRES_PASSWORD: kitchen_test
      COOKIE_SECURE: "false"
      SESSION_DAYS: "1"
      PORT: "8080"
      TEST_API_PORT: "8080"
      TEST_WEB_PORT: "3000"
      TEST_API_BASE: "http://127.0.0.1:8080"
      TEST_WEB_BASE: "http://127.0.0.1:3000"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend and browser test dependencies
        run: |
          npm install --prefix vps/backend
          npm install --prefix tests
          ./tests/node_modules/.bin/playwright install --with-deps chromium

      - name: Prepare isolated regression database
        run: node vps/backend/scripts/regression-setup.mjs

      - name: Start API
        run: |
          node vps/backend/src/server.mjs >/tmp/kitchen-api.log 2>&1 &
          echo $! >/tmp/kitchen-api.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kitchen-api.log
          exit 1

      - name: API role and inventory regression
        run: node vps/backend/scripts/api-regression.mjs

      - name: Start frontend test server
        run: |
          node tests/web-server.mjs >/tmp/kitchen-web.log 2>&1 &
          echo $! >/tmp/kitchen-web.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kitchen-web.log
          exit 1

      - name: Desktop and mobile browser regression
        run: node tests/browser-regression.mjs

      - name: Dump regression logs on failure
        if: failure()
        run: |
          echo "=== API LOG ==="
          cat /tmp/kitchen-api.log 2>/dev/null || true
          echo "=== WEB LOG ==="
          cat /tmp/kitchen-web.log 2>/dev/null || true

  deploy:
    needs:
      - preflight
      - regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Require VPS SSH secret
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::Repository secret VPS_SSH_KEY is not configured."
            exit 1
          fi

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/kitchen_actions"
          chmod 600 "$HOME/.ssh/kitchen_actions"
          ssh-keyscan -H 82.47.180.185 >> "$HOME/.ssh/known_hosts"

      - name: Deploy with server-side backup and rollback
        run: |
          ssh \
            -i "$HOME/.ssh/kitchen_actions" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            deploy@82.47.180.185 \
            'sudo -n /usr/local/sbin/kitchen-os-deploy'

      - name: Production health check
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            http://82.47.180.185/api/health
          echo
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            http://82.47.180.185/RELEASE
          echo

  production-ui-smoke:
    needs:
      - deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install clean browser
        run: |
          npm install --prefix tests
          ./tests/node_modules/.bin/playwright install --with-deps chromium

      - name: Verify production permission modal
        env:
          PRODUCTION_BASE: https://82.47.180.185.nip.io
        run: node tests/production-ui-smoke.mjs
