name: One-shot inventory hydration authority patch

on:
  push:
    branches:
      - fix-hydrate-inventory-authority-20260909
    paths:
      - tests/inventory-hydration-authority-regression.mjs
      - tests/performance-regression.mjs
      - docs/spec-deltas/2026-09-09-hydrate-inventory-authority.md
      - .github/workflows/one-shot-hydrate-inventory-authority.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove legacy inventory mutations from hydration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/store-core.js')
          source = path.read_text()
          blocks = [
          '''      for (const item of DEFAULT_ITEMS.filter((entry) => entry.freezerSheet || ["frozen-noodles", "baby-cabbage", "cabbage"].includes(entry.id))) {
                  if (!record.inventory.some((entry) => entry.id === item.id)) record.inventory.push({ ...structuredClone(item), stockKey: stockKeyFor(item), workArea: item.workArea || inferWorkArea(item) });
                }
          ''',
          '''      const frozenNoodles = record.inventory.find((entry) => entry.id === "frozen-noodles");
                if (frozenNoodles?.minimum === 30) frozenNoodles.minimum = 60;
          ''',
          '''      const duckIntestine = record.inventory.find((entry) => entry.id === "duck-intestine-large");
                if (duckIntestine?.minimum === 10 && duckIntestine?.zone === "large-freezer") {
                  duckIntestine.minimum = 3;
                  duckIntestine.unit = "包";
                  duckIntestine.workArea = "seafood";
                }
          ''',
          '''      for (const item of buildWorkInventory(record.inventory)) {
                  if (!record.workInventory.some((entry) => entry.stockKey === item.stockKey)) record.workInventory.push(item);
                }
          ''',
          ]
          for block in blocks:
              if source.count(block) != 1:
                  raise SystemExit(f'expected hydration block exactly once, found {source.count(block)}')
              source = source.replace(block, '', 1)
          path.write_text(source)
          PY
      - name: Run targeted authority regressions
        run: |
          node tests/inventory-hydration-authority-regression.mjs
          node tests/inventory-empty-snapshot-regression.mjs
          node tests/central-empty-cache-reseed-contract-regression.mjs
          node tests/branch-empty-catalog-fallback-contract-regression.mjs
          node tests/inventory-history-limit-contract-regression.mjs
          node tests/inventory-sync-serialization-regression.mjs
          node tests/vps-inventory-cache-invalidation-regression.mjs
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/one-shot-hydrate-inventory-authority.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/store-core.js tests/performance-regression.mjs tests/inventory-hydration-authority-regression.mjs docs/spec-deltas/2026-09-09-hydrate-inventory-authority.md .github/workflows/one-shot-hydrate-inventory-authority.yml
          git commit -m 'Preserve authoritative inventory during hydration'
          git push
