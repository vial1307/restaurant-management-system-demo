name: Workforce Approval Regression Diagnostic

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/workforce-approval-browser-regression.mjs"
      - "tests/web-server.mjs"
      - "vps/backend/**"
      - "vps/database/**"
      - ".github/workflows/workforce-approval-diagnostic.yml"

permissions:
  contents: read

jobs:
  workforce-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kitchen_test
          POSTGRES_PASSWORD: kitchen_test
          POSTGRES_DB: kitchen_test
        options: >-
          --health-cmd "pg_isready -U kitchen_test -d kitchen_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: kitchen_test
      POSTGRES_USER: kitchen_test
      POSTGRES_PASSWORD: kitchen_test
      COOKIE_SECURE: "false"
      SESSION_DAYS: "1"
      PORT: "8080"
      TEST_API_PORT: "8080"
      TEST_WEB_PORT: "3000"
      TEST_API_BASE: "http://127.0.0.1:8080"
      TEST_WEB_BASE: "http://localhost:3000"
      PLAYWRIGHT_BROWSERS_PATH: "/ms-playwright"
      WORKFORCE_APPROVAL_ONLY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install packages
        run: |
          npm ci --prefix vps/backend
          npm ci --prefix tests

      - name: Prepare isolated regression database
        run: node vps/backend/scripts/regression-setup.mjs

      - name: Start API
        run: |
          node vps/backend/src/server.mjs >/tmp/kitchen-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/kitchen-api.log
          exit 1

      - name: Start frontend test server
        run: |
          node tests/web-server.mjs >/tmp/kitchen-web.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/kitchen-web.log
          exit 1

      - name: Workforce approval browser regression
        shell: bash
        run: |
          set -o pipefail
          mkdir -p tests/artifacts/workforce-approval
          node tests/workforce-approval-browser-regression.mjs 2>&1 | tee tests/artifacts/workforce-approval/run.log

      - name: Capture service logs
        if: always()
        run: |
          mkdir -p tests/artifacts/workforce-approval
          cp /tmp/kitchen-api.log tests/artifacts/workforce-approval/api.log 2>/dev/null || true
          cp /tmp/kitchen-web.log tests/artifacts/workforce-approval/web.log 2>/dev/null || true

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workforce-approval-diagnostic
          path: tests/artifacts/workforce-approval
          if-no-files-found: error
          retention-days: 7
