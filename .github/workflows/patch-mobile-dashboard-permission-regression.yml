name: Patch mobile dashboard permission regression

on:
  push:
    branches:
      - fix-mobile-dashboard-permission-visibility-20260907-z
    paths:
      - ".github/workflows/patch-mobile-dashboard-permission-regression.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Patch browser regression
        run: python3 scripts/patch-mobile-dashboard-permission-regression.py
      - name: Validate browser regression syntax
        run: node --check tests/browser-regression.mjs
      - name: Commit regression update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser-regression.mjs
          git commit -m "Test mobile dashboard permission visibility"
          git push origin HEAD:fix-mobile-dashboard-permission-visibility-20260907-z
