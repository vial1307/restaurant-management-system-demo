name: Inventory Master Data Refactor CI

on:
  push:
    branches:
      - codex/database-driven-inventory-master-data

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Validate JavaScript syntax
        run: |
          set -euo pipefail
          for file in src/*.js tests/*.mjs vps/backend/src/*.mjs; do
            node --check "$file"
          done

      - name: Inventory master-data contract
        run: node tests/inventory-master-data-regression.mjs

      - name: Static regression
        run: node tests/static-regression.mjs

      - name: Performance guards
        run: node tests/performance-regression.mjs
