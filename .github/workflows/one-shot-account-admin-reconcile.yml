name: One-shot account admin reconcile patch

on:
  push:
    branches:
      - fix-account-admin-no-reload-20260908
    paths:
      - ".github/workflows/one-shot-account-admin-reconcile.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix-account-admin-no-reload-20260908

      - name: Patch VPS account CRUD lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/vps-auth-bridge.js")
          source = path.read_text(encoding="utf-8")

          old_save = '''    try {
      await vpsSaveUser(body);
      await syncProfiles();
      document.querySelector("[data-account-modal]")?.remove();
      location.reload();
    } catch (error) {'''
          new_save = '''    try {
      const result = await vpsSaveUser(body);
      const currentSession = legacySession();
      if (result?.user?.id === currentSession?.id) {
        invalidateCurrentVpsUser();
        mirrorVpsSession(result.user);
        window.dispatchEvent(new CustomEvent("shitu:auth-synced"));
      }
      await syncProfiles();
      document.querySelector("[data-account-modal]")?.remove();
    } catch (error) {'''

          old_delete = '''  try {
    await vpsDeleteUser(deleteButton.dataset.accountDelete);
    await syncProfiles();
    document.querySelector("[data-account-modal]")?.remove();
    location.reload();
  } catch (error) {'''
          new_delete = '''  try {
    await vpsDeleteUser(deleteButton.dataset.accountDelete);
    await syncProfiles();
    document.querySelector("[data-account-modal]")?.remove();
  } catch (error) {'''

          if source.count(old_save) != 1:
              raise SystemExit(f"expected one account save lifecycle, found {source.count(old_save)}")
          if source.count(old_delete) != 1:
              raise SystemExit(f"expected one account delete lifecycle, found {source.count(old_delete)}")

          source = source.replace(old_save, new_save).replace(old_delete, new_delete)
          path.write_text(source, encoding="utf-8")
          Path(".github/workflows/one-shot-account-admin-reconcile.yml").unlink()
          PY

      - name: Validate targeted contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check src/vps-auth-bridge.js
          node tests/account-admin-reconcile-regression.mjs
          node tests/performance-regression.mjs

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vps-auth-bridge.js tests/performance-regression.mjs tests/account-admin-reconcile-regression.mjs docs/spec-deltas/2026-09-08-account-admin-no-reload.md .github/workflows/one-shot-account-admin-reconcile.yml
          git commit -m "Reconcile account admin mutations without reload"
          git push origin HEAD:fix-account-admin-no-reload-20260908
