name: One-time inventory persistence fix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-inventory-persistence-fix.yml"

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Remove local-success inventory mutation fallbacks
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cloud = Path("src/inventory-cloud.js")
          text = cloud.read_text(encoding="utf-8")
          old = '{ ok: false, fallback: true }'
          count = text.count(old)
          if count != 14:
              raise SystemExit(f"Expected exactly 14 inventory mutation fallback returns, found {count}; refusing broad edit")
          replacement = '{ ok: false, fallback: false, error: new Error("INVENTORY_BACKEND_NOT_READY") }'
          text = text.replace(old, replacement)
          if 'fallback: true' in text:
              raise SystemExit("Unexpected fallback:true remains in inventory-cloud.js; inspect manually")
          cloud.write_text(text, encoding="utf-8")

          test = Path("tests/performance-regression.mjs")
          source = test.read_text(encoding="utf-8")
          anchor = 'assert.doesNotMatch(receiveDefaultSave, /ok:true,fallback:true/, "receive-default writes must never report fallback success");\n'
          addition = anchor + '\nassert.doesNotMatch(inventoryCloud, /return \\{ ok: false, fallback: true \\}/, "inventory mutations must never fall back to local-only success when PostgreSQL is unavailable");\nassert.match(inventoryCloud, /fallback: false, error: new Error\\(\"INVENTORY_BACKEND_NOT_READY\"\\)/, "inventory mutation backend failures must be explicit so optimistic UI can roll back");\n'
          if anchor not in source:
              raise SystemExit("Persistence regression anchor not found; refusing test edit")
          if "inventory mutations must never fall back to local-only success" not in source:
              source = source.replace(anchor, addition, 1)
          test.write_text(source, encoding="utf-8")

          Path(".github/workflows/one-time-inventory-persistence-fix.yml").unlink()
          PY

      - name: Validate guarded patch
        run: |
          set -euo pipefail
          node --check src/inventory-cloud.js
          node --check tests/performance-regression.mjs
          node tests/performance-regression.mjs
          if grep -n 'fallback: true' src/inventory-cloud.js; then
            echo 'Unsafe inventory mutation fallback remains' >&2
            exit 1
          fi

      - name: Commit persistence fix
        run: |
          set -euo pipefail
          git config user.name "Kitchen OS CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/inventory-cloud.js tests/performance-regression.mjs .github/workflows/one-time-inventory-persistence-fix.yml
          git commit -m "Require PostgreSQL confirmation for inventory mutations"
          git push origin HEAD:main

      - name: Run full production pipeline for patched main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-vps.yml/dispatches" \
            -d '{"ref":"main"}'
