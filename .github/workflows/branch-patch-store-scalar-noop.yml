name: One-shot store scalar no-op patch

on:
  push:
    branches:
      - perf-store-scalar-noop-suppression-20260906

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf-store-scalar-noop-suppression-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply and verify scalar no-op patch
        run: |
          python3 scripts/patch-store-scalar-noop.py
          node tests/store-scalar-noop-regression.mjs
          node tests/performance-regression.mjs
          git rm .github/workflows/branch-patch-store-scalar-noop.yml scripts/patch-store-scalar-noop.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/store-core.js
          git commit -m "Suppress scalar store no-op mutations"
          git push origin HEAD:perf-store-scalar-noop-suppression-20260906
