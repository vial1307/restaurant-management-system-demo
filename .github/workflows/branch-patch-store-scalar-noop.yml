name: One-shot store scalar no-op patch

on:
  push:
    branches:
      - perf-store-scalar-noop-suppression-20260906

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf-store-scalar-noop-suppression-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Patch scalar no-op guards only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/store-core.js')
          text = path.read_text()

          replacements = [
          ('''    selectDate(date) {
              return update((draft) => {
                ensureRecord(draft, date);
                draft.selectedDate = date;
              });
            },''', '''    selectDate(date) {
              if (state.selectedDate === date && state.records[date]) return state;
              return update((draft) => {
                ensureRecord(draft, date);
                draft.selectedDate = date;
              });
            },'''),
          ('''    updateSetting(key, value) {
              return update((draft) => {
                draft.settings[key] = ["language", "employeeName", "workstation"].includes(key)
                  ? value
                  : clampNumber(value);
              });
            },''', '''    updateSetting(key, value) {
              const next = ["language", "employeeName", "workstation"].includes(key)
                ? value
                : clampNumber(value);
              if (state.settings[key] === next) return state;
              return update((draft) => {
                draft.settings[key] = next;
              });
            },'''),
          ('''    updateReservation(key, value) {
              return update((draft) => {
                draft.records[draft.selectedDate].reservation[key] = clampNumber(value);
              });
            },''', '''    updateReservation(key, value) {
              const next = clampNumber(value);
              if (state.records[state.selectedDate].reservation[key] === next) return state;
              return update((draft) => {
                draft.records[draft.selectedDate].reservation[key] = next;
              });
            },'''),
          ('''    updateRemaining(key, value) {
              return update((draft) => {
                draft.records[draft.selectedDate].reservation.remaining[key] = clampNumber(value);
              });
            },''', '''    updateRemaining(key, value) {
              const next = clampNumber(value);
              if (state.records[state.selectedDate].reservation.remaining[key] === next) return state;
              return update((draft) => {
                draft.records[draft.selectedDate].reservation.remaining[key] = next;
              });
            },'''),
          ('''    updateRice(value) {
              return update((draft) => {
                draft.records[draft.selectedDate].riceRemaining = clampNumber(value);
              });
            },''', '''    updateRice(value) {
              const next = clampNumber(value);
              if (state.records[state.selectedDate].riceRemaining === next) return state;
              return update((draft) => {
                draft.records[draft.selectedDate].riceRemaining = next;
              });
            },'''),
          ('''    updateProcurementLine(id, key, value) {
              return update((draft) => {
                const record = draft.records[draft.selectedDate];
                record.procurement ??= { planned: {}, incoming: {} };
                const bucket = key === "planned" ? record.procurement.planned : record.procurement.incoming;
                bucket[id] = clampNumber(value);
              });
            },''', '''    updateProcurementLine(id, key, value) {
              const next = clampNumber(value);
              const record = state.records[state.selectedDate];
              const bucketName = key === "planned" ? "planned" : "incoming";
              const currentBucket = record.procurement?.[bucketName];
              if (currentBucket && Object.hasOwn(currentBucket, id) && currentBucket[id] === next) return state;
              return update((draft) => {
                const targetRecord = draft.records[draft.selectedDate];
                targetRecord.procurement ??= { planned: {}, incoming: {} };
                const bucket = bucketName === "planned" ? targetRecord.procurement.planned : targetRecord.procurement.incoming;
                bucket[id] = next;
              });
            },'''),
          ('''    updateProcurementOrderDate(category, value) {
              return update((draft) => {
                if (!["noodles", "vegetables", "factory"].includes(category) || !/^\\d{4}-\\d{2}-\\d{2}$/.test(String(value))) return;
                const record = draft.records[draft.selectedDate];
                record.procurement ??= { planned: {}, incoming: {}, orderDates: {} };
                record.procurement.orderDates ??= {};
                record.procurement.orderDates[category] = String(value);
              });
            },''', '''    updateProcurementOrderDate(category, value) {
              const next = String(value);
              if (!["noodles", "vegetables", "factory"].includes(category) || !/^\\d{4}-\\d{2}-\\d{2}$/.test(next)) return state;
              const current = state.records[state.selectedDate].procurement?.orderDates?.[category];
              if (current === next) return state;
              return update((draft) => {
                const record = draft.records[draft.selectedDate];
                record.procurement ??= { planned: {}, incoming: {}, orderDates: {} };
                record.procurement.orderDates ??= {};
                record.procurement.orderDates[category] = next;
              });
            },'''),
          ('''    updateItem(id, key, value) {
              return update((draft) => {
                const record = draft.records[draft.selectedDate];
                const item = record.inventory.find((entry) => entry.id === id);
                if (item) item[key] = ["quantity", "minimum"].includes(key) ? clampNumber(value) : value;
                if (item && ["workArea", "label", "labelVi", "unit"].includes(key)) {
                  const workItem = record.workInventory.find((entry) => entry.stockKey === item.stockKey);
                  if (workItem) workItem[key] = value;
                  for (const source of record.inventory) {
                    if (source.stockKey === item.stockKey) source[key] = value;
                  }
                }
              });
            },''', '''    updateItem(id, key, value) {
              const record = state.records[state.selectedDate];
              const item = record.inventory.find((entry) => entry.id === id);
              if (!item) return state;
              const next = ["quantity", "minimum"].includes(key) ? clampNumber(value) : value;
              const propagated = ["workArea", "label", "labelVi", "unit"].includes(key);
              if (item[key] === next) {
                if (!propagated) return state;
                const workItem = record.workInventory.find((entry) => entry.stockKey === item.stockKey);
                const inventoryMatches = record.inventory
                  .filter((entry) => entry.stockKey === item.stockKey)
                  .every((entry) => entry[key] === next);
                const workMatches = !workItem || workItem[key] === next;
                if (inventoryMatches && workMatches) return state;
              }
              return update((draft) => {
                const targetRecord = draft.records[draft.selectedDate];
                const targetItem = targetRecord.inventory.find((entry) => entry.id === id);
                if (!targetItem) return;
                targetItem[key] = next;
                if (propagated) {
                  const workItem = targetRecord.workInventory.find((entry) => entry.stockKey === targetItem.stockKey);
                  if (workItem) workItem[key] = next;
                  for (const source of targetRecord.inventory) {
                    if (source.stockKey === targetItem.stockKey) source[key] = next;
                  }
                }
              });
            },'''),
          ('''    updateWorkItem(id, key, value) {
              return update((draft) => {
                const record = draft.records[draft.selectedDate];
                const item = record.workInventory.find((entry) => entry.id === id);
                if (!item) return;

                item[key] = ["quantity", "minimum"].includes(key) ? clampNumber(value) : value;
                if (key === "workArea") {
                  for (const source of record.inventory) {
                    if (source.stockKey === item.stockKey) source.workArea = value;
                  }
                }
              });
            },''', '''    updateWorkItem(id, key, value) {
              const record = state.records[state.selectedDate];
              const item = record.workInventory.find((entry) => entry.id === id);
              if (!item) return state;
              const next = ["quantity", "minimum"].includes(key) ? clampNumber(value) : value;
              if (item[key] === next) {
                if (key !== "workArea") return state;
                const sourcesMatch = record.inventory
                  .filter((entry) => entry.stockKey === item.stockKey)
                  .every((entry) => entry.workArea === next);
                if (sourcesMatch) return state;
              }
              return update((draft) => {
                const targetRecord = draft.records[draft.selectedDate];
                const targetItem = targetRecord.workInventory.find((entry) => entry.id === id);
                if (!targetItem) return;

                targetItem[key] = next;
                if (key === "workArea") {
                  for (const source of targetRecord.inventory) {
                    if (source.stockKey === targetItem.stockKey) source.workArea = next;
                  }
                }
              });
            },'''),
          ]

          for old, new in replacements:
              count = text.count(old)
              assert count == 1, f'expected one exact setter block, found {count}: {old.splitlines()[0]}'
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          node tests/store-scalar-noop-regression.mjs
          node tests/performance-regression.mjs

          git rm .github/workflows/branch-patch-store-scalar-noop.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/store-core.js
          git commit -m "Suppress scalar store no-op mutations"
          git push origin HEAD:perf-store-scalar-noop-suppression-20260906
