<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f6f8fc">
<title>Finance OS · Tài chính cá nhân</title>
<link rel="stylesheet" href="/src/personal-finance.css">
</head><body>
<section id="finance-login" class="login-screen" hidden>
 <form id="finance-login-form" class="login-card">
  <div class="brand-icon">◈</div><h1>Finance OS</h1><p>Không gian tài chính cá nhân</p>
  <label>Tài khoản<input name="username" autocomplete="username" required></label>
  <label>Mật khẩu<input name="password" type="password" autocomplete="current-password" required></label>
  <div id="finance-login-error" class="error" role="alert" hidden></div>
  <button type="submit" class="btn primary">Đăng nhập</button><small>Chỉ tài khoản chủ sở hữu được phép truy cập.</small>
 </form>
</section>
<div id="finance-layout" class="app-shell" hidden>
 <aside class="sidebar">
  <div class="brand"><span class="brand-icon">◈</span><div><strong>Finance OS</strong><small>Plan · Track · Grow</small></div></div>
  <p class="nav-label">QUẢN LÝ CÁ NHÂN</p>
  <nav class="main-nav" aria-label="Điều hướng">
   <button data-tab="overview" class="selected"><span>▦</span>Tổng quan</button>
   <button data-tab="plan"><span>▤</span>Kế hoạch tài chính</button>
   <button data-tab="commitments"><span>◎</span>Công nợ & mục tiêu</button>
   <button data-tab="reports"><span>▥</span>Dòng tiền & báo cáo</button>
   <button data-tab="simulator"><span>◷</span>Mô phỏng & tư vấn</button>
   <button data-tab="mentor"><span>♧</span>AI Mentor</button>
  </nav>
  <div class="sidebar-end"><button data-tab="settings"><span>⚙</span>Tài khoản & cài đặt</button>
  <p>Finance OS · Chỉ dành cho bạn</p></div>
 </aside>
 <div class="main-shell">
  <header class="topbar"><div class="topbar-title"><span class="mobile-brand">◈ Finance OS</span><small>Không gian tài chính của bạn</small></div>
    <div class="topbar-tools"><label>Tháng <input id="finance-month" type="month"></label><button id="finance-reload" title="Đồng bộ dữ liệu" aria-label="Đồng bộ dữ liệu">↻</button><button id="finance-settings" title="Tài khoản & cài đặt" aria-label="Tài khoản & cài đặt">⚙</button>
    <button id="finance-logout" title="Đăng xuất">Đăng xuất</button></div>
  </header>
  <main id="finance-content" class="page" aria-live="polite"><p>Đang tải dữ liệu Finance...</p></main>
 </div>
</div>
<dialog id="finance-dialog" class="editor">
 <div class="editor-header"><h2 id="finance-dialog-title">Nhập dữ liệu</h2><button id="finance-dialog-close" type="button" aria-label="Đóng">×</button></div>
 <form id="finance-form"><div id="finance-fields"></div>
  <div class="editor-actions"><button id="finance-dialog-cancel" type="button" class="btn ghost">Hủy</button><button id="finance-submit" type="submit" class="btn primary">Lưu thay đổi</button></div>
 </form>
</dialog>
<div id="finance-toast" class="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="/src/personal-finance.js"></script>
</body></html>
