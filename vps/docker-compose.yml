services:
  db:
    image: postgres:16-alpine
    container_name: kitchen-os-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kitchen_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./repo/vps/backend
    container_name: kitchen-os-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POOL_MAX: 10
      SESSION_DAYS: 14
      COOKIE_SECURE: "false"
      APP_RELEASE: ${APP_RELEASE:-vps-dev}
      WORKFORCE_SCHEDULE_RELATIONAL_READ: ${WORKFORCE_SCHEDULE_RELATIONAL_READ:-true}
      HOST_METRICS_PATH: /run/kitchen-host-metrics/host-metrics.env
      HOST_ACTION_DIR: /run/kitchen-admin-actions
    volumes:
      - ./runtime:/run/kitchen-host-metrics:ro
      - ./admin-actions:/run/kitchen-admin-actions
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - kitchen_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  agentmemory:
    build:
      context: ./repo/vps/agentmemory
      args:
        AGENTMEMORY_VERSION: "0.9.29"
    container_name: kitchen-agentmemory
    restart: unless-stopped
    network_mode: host
    env_file:
      - ./agentmemory.env
    environment:
      CI: "1"
      HOME: /home/node
      AGENTMEMORY_DATA_DIR: /data
      AGENTMEMORY_TOOLS: core
      AGENTMEMORY_AUTO_COMPRESS: "false"
      AGENTMEMORY_INJECT_CONTEXT: "false"
      III_TELEMETRY_ENABLED: "false"
    volumes:
      - ./agentmemory-data:/data
      - ./agentmemory-home:/home/node/.agentmemory
      - ./repo:/workspace:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"Authorization: Bearer ${AGENTMEMORY_SECRET}\" http://127.0.0.1:3111/agentmemory/livez >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    image: caddy:2.10-alpine
    container_name: kitchen-os-web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./www:/srv:ro
      - ./repo/vps/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - kitchen_internal
      - marketing_edge
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  kitchen_internal:
    driver: bridge
  marketing_edge:
    external: true
    name: marketing_edge
